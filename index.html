<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velox | Registro de Comercios</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-amber-500">Velox</h1>
      <p class="text-slate-400 text-sm mt-1">Registra tu restaurante y activa tu menú digital</p>
    </div>

    <!-- Formulario de Registro (Paso 1 y 2 del Manual) -->
    <form id="form-registro" class="space-y-4">
      <div>
        <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Nombre del Restaurante</label>
        <input type="text" id="nombreRestaurante" required class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500" placeholder="Ej: Hamburguesas Veloxing">
      </div>

      <div>
        <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Nombre del Encargado</label>
        <input type="text" id="nombreEncargado" required class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500" placeholder="Tu nombre">
      </div>

      <div>
        <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Teléfono WhatsApp</label>
        <input type="tel" id="telefono" required class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500" placeholder="3001234567">
      </div>

      <div>
        <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Correo Electrónico</label>
        <input type="email" id="email" required class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500" placeholder="correo@restaurante.com">
      </div>

     <div style="position: relative;">
    <!-- Campo de contraseña con tus clases de Tailwind originales -->
    <input type="password" id="password" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-amber-500" placeholder="Contraseña" required style="padding-right: 40px;">
    
    <!-- Botón con íconos SVG profesionales (Ojo Abierto y Ojo Cerrado) -->
    <button type="button" id="togglePassword" onclick="togglePasswordVisibility()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; display: flex; align-items: center; color: #94a3b8;" class="hover:text-amber-400 transition-colors duration-200">
        
        <!-- Ícono de Ojo Abierto (se muestra por defecto) -->
        <svg id="icon-eye-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>

        <!-- Ícono de Ojo Cerrado (Oculto por defecto) -->
        <svg id="icon-eye-closed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5" style="display: none;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.223 6.223A10.483 10.483 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 0 1-4.293 5.774M6.223 6.223 3 3m19.898 19.898-3.963-3.963m-5.278-5.278A4.5 4.5 0 0 1 6.223 8.223m0 0 3 3" />
        </svg>
    </button>
</div>

      <!-- Selección del Plan (Paso 3 del Manual) -->
      <div>
        <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Selecciona tu Plan</label>
        <select id="plan" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
          <option value="prueba">Prueba Gratis (7 Días)</option>
          <option value="mensual">Plan Mensual</option>
          <option value="anual">Plan Anual</option>
        </select>
      </div>
      <div style="text-align: center; margin-top: 15px;">
        <p class="text-sm text-slate-400">¿Ya tienes una cuenta? 
            <a href="login.html" class="text-amber-400 underline font-medium">Inicia sesión aquí</a>
        </p>
    </div>

      <button type="submit" id="btnRegistrar" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-lg transition duration-200">
        Crear Cuenta y Continuar
      </button>
    </form>
  </div> 

  <script src="app.registro.js"></script>
</body>
</html>
