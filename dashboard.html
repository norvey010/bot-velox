<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velox Bot - Panel de Control</title>
  <!-- Tailwind CSS CDN para un diseño moderno -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></div>
      <h1 class="text-xl font-bold tracking-wide text-emerald-400">⚡ VELOX BOT <span class="text-xs font-normal text-slate-400">| Panel de Pedidos</span></h1>
    </div>
    <div class="flex items-center gap-4 text-sm text-slate-300">
      <span id="connection-status" class="bg-emerald-950 text-emerald-400 px-3 py-1 rounded-full border border-emerald-800 text-xs">● Conectado en vivo</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-6 space-y-6">

    <!-- Tarjetas de Métricas -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
        <p class="text-xs text-slate-400 font-medium">Pedidos Registrados</p>
        <h3 id="total-pedidos-count" class="text-3xl font-bold text-white mt-1">0</h3>
      </div>
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
        <p class="text-xs text-slate-400 font-medium">Ventas Totales</p>
        <h3 id="total-ventas-sum" class="text-3xl font-bold text-emerald-400 mt-1">$0</h3>
      </div>
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
        <p class="text-xs text-slate-400 font-medium">Pedidos Pendientes</p>
        <h3 id="total-pendientes-count" class="text-3xl font-bold text-amber-400 mt-1">0</h3>
      </div>
    </div>

    <!-- Barra de Filtros y Búsqueda -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col md:flex-row gap-4 items-center justify-between">
      <div class="w-full md:w-1/3">
        <input type="text" id="input-search" placeholder="🔍 Buscar por teléfono o cliente..." 
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
      </div>
      <div class="flex items-center gap-3 w-full md:w-auto">
        <select id="select-estado" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
          <option value="todos">Todos los Estados</option>
          <option value="pendiente">Pendientes 🟡</option>
          <option value="preparando">En Preparación 🟠</option>
          <option value="en_camino">En Camino 🔵</option>
          <option value="entregado">Entregados 🟢</option>
          <option value="cancelado">Cancelados 🔴</option>
        </select>
        <button onclick="cargarPedidos()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm text-white transition">Actualizar</button>
      </div>
    </div>

    <!-- Tabla Estructurada para Carga Infinita / Historial -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-900/80 text-xs uppercase text-slate-400 border-b border-slate-700">
              <th class="p-4">Fecha / Hora</th>
              <th class="p-4">Cliente</th>
              <th class="p-4">Detalle / Productos</th>
              <th class="p-4">Dirección</th>
              <th class="p-4">Total</th>
              <th class="p-4 text-center">Acciones</th>
              <th class="p-4 text-center">Estado</th>
            </tr>
          </thead>
          <tbody id="pedidos-body" class="divide-y divide-slate-700/50 text-sm">
            <tr>
              <td colspan="7" class="text-center p-8 text-slate-500">...
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Paginador para Soportar Años de Datos -->
      <div class="p-4 border-t border-slate-700 flex justify-between items-center bg-slate-800">
        <span id="page-info" class="text-xs text-slate-400">Página 1</span>
        <div class="flex gap-2">
          <button id="btn-prev" onclick="cambiarPagina(-1)" class="bg-slate-700 hover:bg-slate-600 disabled:opacity-50 px-3 py-1 rounded text-xs text-white">Anterior</button>
          <button id="btn-next" onclick="cambiarPagina(1)" class="bg-slate-700 hover:bg-slate-600 disabled:opacity-50 px-3 py-1 rounded text-xs text-white">Siguiente</button>
        </div>
      </div>
    </div>

  </main>

  <script>
  const SUPABASE_URL = 'https://ozailviyimrjmebrilbp.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96YWlsdml5aW1yam1lYnJpbGJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMTA5MTEsImV4cCI6MjEwMDY4NjkxMX0.rkWEtTGV4uFB_w62sC-vygZoLbfEgx_KKTSd9oS-5CM';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let paginaActual = 0;
  const porPagina = 15;

  async function cargarPedidos() {
    const estado = document.getElementById('select-estado').value;
    const busqueda = document.getElementById('input-search').value.trim();

    let query = supabaseClient
      .from('pedidos')
      .select('*', { count: 'exact' })
      .order('created_at', { ascending: false })
      .range(paginaActual * porPagina, (paginaActual + 1) * porPagina - 1);

    if (estado !== 'todos') {
      query = query.eq('estado', estado);
    }

    if (busqueda) {
      query = query.or(`cliente_nombre.ilike.%${busqueda}%,cliente_telefono.ilike.%${busqueda}%`);
    }

    const { data, count, error } = await query;

    if (error) {
      console.error('Error cargando pedidos:', error);
      document.getElementById('pedidos-body').innerHTML = `<tr><td colspan="6" class="text-center p-8 text-rose-400">Error: ${error.message}</td></tr>`;
      return;
    }

    renderTabla(data);
    actualizarPaginacion(count);
    calcularMetricas();
  }

  function renderTabla(pedidos) {
    const tbody = document.getElementById('pedidos-body');
    tbody.innerHTML = '';

    if (!pedidos || pedidos.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-slate-500">No hay pedidos registrados aún.</td></tr>`;
      return;
    }

    pedidos.forEach(p => {
      const fecha = new Date(p.created_at).toLocaleString('es-CO');
      const badgeColor = getBadgeColor(p.estado || 'pendiente');

      tbody.innerHTML += `
        <tr class="hover:bg-slate-750 transition">
          <td class="p-4 text-xs text-slate-400 whitespace-nowrap">${fecha}</td>
          <td class="p-4">
            <div class="font-medium text-white">${p.cliente_nombre || 'Cliente'}</div>
            <div class="text-xs text-slate-400">${p.cliente_telefono || ''}</div>
          </td>
          <td class="p-4 max-w-xs truncate text-slate-300" title="${p.items}">${p.items || 'Sin detalle'}</td>
          <td class="p-4 max-w-xs truncate text-slate-300" title="${p.direccion}">${p.direccion || 'Sin dirección'}</td>
          <td class="p-4 font-bold text-emerald-400">$${(p.total || 0).toLocaleString()}</td>
          <td class="p-4 text-center">
            <select onchange="actualizarEstado('${p.id}', this.value)" class="text-xs font-semibold px-2.5 py-1 rounded-full border ${badgeColor} bg-slate-900 cursor-pointer focus:outline-none">
              <option value="pendiente" ${p.estado === 'pendiente' ? 'selected' : ''}>🟡 Pendiente</option>
              <option value="preparando" ${p.estado === 'preparando' ? 'selected' : ''}>🟠 Preparando</option>
              <option value="en_camino" ${p.estado === 'en_camino' ? 'selected' : ''}>🔵 En Camino</option>
              <option value="entregado" ${p.estado === 'entregado' ? 'selected' : ''}>🟢 Entregado</option>
              <option value="cancelado" ${p.estado === 'cancelado' ? 'selected' : ''}>🔴 Cancelado</option>
            </select>
          </td>
        </tr>
      `;
    });
  }

  async function actualizarEstado(id, nuevoEstado) {
    await supabaseClient.from('pedidos').update({ estado: nuevoEstado }).eq('id', id);
    cargarPedidos();
  }

  function getBadgeColor(estado) {
    switch (estado) {
      case 'pendiente': return 'text-amber-400 border-amber-800';
      case 'preparando': return 'text-orange-400 border-orange-800';
      case 'en_camino': return 'text-blue-400 border-blue-800';
      case 'entregado': return 'text-emerald-400 border-emerald-800';
      case 'cancelado': return 'text-rose-400 border-rose-800';
      default: return 'text-slate-400 border-slate-700';
    }
  }

  async function calcularMetricas() {
    const { data } = await supabaseClient.from('pedidos').select('total, estado');
    if (data) {
      document.getElementById('total-pedidos-count').innerText = data.length;
      const totalVentas = data.reduce((sum, p) => sum + (p.total || 0), 0);
      document.getElementById('total-ventas-sum').innerText = `$${totalVentas.toLocaleString()}`;
      const pendientes = data.filter(p => p.estado === 'pendiente').length;
      document.getElementById('total-pendientes-count').innerText = pendientes;
    }
  }

  function cambiarPagina(delta) {
    paginaActual += delta;
    if (paginaActual < 0) paginaActual = 0;
    cargarPedidos();
  }

  function actualizarPaginacion(totalCount) {
    document.getElementById('page-info').innerText = `Página ${paginaActual + 1} de ${Math.ceil(totalCount / porPagina) || 1}`;
    document.getElementById('btn-prev').disabled = paginaActual === 0;
    document.getElementById('btn-next').disabled = (paginaActual + 1) * porPagina >= totalCount;
  }

  document.getElementById('input-search').addEventListener('input', () => { paginaActual = 0; cargarPedidos(); });
  document.getElementById('select-estado').addEventListener('change', () => { paginaActual = 0; cargarPedidos(); });

  cargarPedidos();
</script>
</body>
</html>
