<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comanda de Cocina - Velox</title>
    <style>
        :root { --ticket-paper-width: 80mm; }
        body {
            font-family: 'Courier New', Courier, monospace;
            width: calc(var(--ticket-paper-width) - 6mm);
            box-sizing: border-box;
            margin: 0 auto;
            padding: 10px;
            color: #000;
            background: #fff;
        }
        .text-center { text-align: center; }
        .bold { font-weight: bold; }
        .line { border-bottom: 1px dashed #000; margin: 8px 0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        td, th { text-align: left; vertical-align: top; padding: 3px 0; }
        #ticket-items td { white-space: pre-wrap; overflow-wrap: anywhere; }
        .total { font-size: 16px; margin-top: 10px; }
        .btn-print {
            display: block;
            width: 100%;
            padding: 10px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        @media print {
            .btn-print { display: none; } /* Ocultar el botón al imprimir */
            body { width: var(--ticket-paper-width); margin: 0; padding: 3mm; }
        }
    </style>
</head>
<body>

    <button class="btn-print" onclick="window.print()">🖨️ IMPRIMIR COMANDA</button>

    <div class="text-center">
        <h2 style="margin:0;">VELOX ORDERS</h2>
        <p style="margin:2px 0; font-size: 12px;">Comanda de Cocina</p>
    </div>

    <div class="line"></div>

    <div style="font-size: 12px;">
        <p style="margin: 2px 0;"><strong>FECHA:</strong> <span id="ticket-fecha">--/--/----</span></p>
        <p style="margin: 2px 0;"><strong>CLIENTE:</strong> <span id="ticket-cliente">Cargando...</span></p>
        <p style="margin: 2px 0;"><strong>TEL:</strong> <span id="ticket-tel">--</span></p>
        <p style="margin: 2px 0;"><strong>DIR:</strong> <span id="ticket-dir">--</span></p>
        <p id="ticket-notas-linea" style="margin: 2px 0; display: none;"><strong>NOTAS:</strong> <span id="ticket-notas"></span></p>
    </div>

    <div class="line"></div>

    <table>
        <thead>
            <tr>
                <th>PRODUCTOS Y VARIANTES</th>
            </tr>
        </thead>
        <tbody id="ticket-items">
            <!-- Productos dinámicos -->
        </tbody>
    </table>

    <div class="line"></div>

    <div class="total bold text-center">
        TOTAL: $<span id="ticket-total">0</span>
    </div>
    <div style="font-size: 11px; text-align: center; margin-top: 4px;">
        PAGO: <span id="ticket-pago">Nequi / Efectivo</span>
    </div>

    <div class="line"></div>
    <p class="text-center" style="font-size: 10px; margin: 0;">-- Sistema Velox Automations --</p>

    <script>
        // Cargar datos de la URL o LocalStorage
        const urlParams = new URLSearchParams(window.location.search);
        const anchoPapel = Number(urlParams.get('ancho')) === 58 ? 58 : 80;
        document.documentElement.style.setProperty('--ticket-paper-width', `${anchoPapel}mm`);
        const fechaPedido = new Date(urlParams.get('fecha') || Date.now());
        document.getElementById('ticket-fecha').innerText = Number.isNaN(fechaPedido.getTime())
            ? new Date().toLocaleString('es-CO')
            : fechaPedido.toLocaleString('es-CO');
        document.getElementById('ticket-cliente').innerText = urlParams.get('cliente') || 'Cliente General';
        document.getElementById('ticket-tel').innerText = urlParams.get('telefono') || 'N/A';
        document.getElementById('ticket-dir').innerText = urlParams.get('direccion') || 'Recoge en Local';
        const total = Number(urlParams.get('total') || 0);
        document.getElementById('ticket-total').innerText = total.toLocaleString('es-CO');
        document.getElementById('ticket-pago').innerText = urlParams.get('pago') || 'Pendiente';
        const notas = (urlParams.get('notas') || '').trim();
        if (notas) {
            document.getElementById('ticket-notas').innerText = notas;
            document.getElementById('ticket-notas-linea').style.display = 'block';
        }

        const detalle = urlParams.get('items') || 'Sin detalle del pedido';
        const ticketItems = document.getElementById('ticket-items');
        const productos = detalle.split(/,\s*(?=\d+\s*x\s)/i).filter(Boolean);
        for (const producto of productos) {
            const fila = document.createElement('tr');
            const celda = document.createElement('td');
            celda.textContent = producto;
            fila.appendChild(celda);
            ticketItems.appendChild(fila);
        }

        // Solicita a los navegadores compatibles un formato de recibo del ancho elegido.
        // El controlador de impresión todavía puede imponer el tamaño configurado en el dispositivo.
        window.onload = () => {
            const altoPapelMm = Math.max(60, Math.ceil((document.body.scrollHeight + 16) * 25.4 / 96));
            const estiloPagina = document.createElement('style');
            estiloPagina.textContent = `@page { size: ${anchoPapel}mm ${altoPapelMm}mm; margin: 0; }`;
            document.head.appendChild(estiloPagina);
            setTimeout(() => window.print(), 500);
        };
    </script>
</body>
</html>
