<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Menú digital | Velox Bot</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    @keyframes velox-editor-pulso {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 75, 55, 0), 0 10px 18px rgba(120, 35, 20, .18); transform: scale(1); }
      45% { box-shadow: 0 0 0 5px rgba(220, 75, 55, .22), 0 10px 22px rgba(180, 45, 25, .32); transform: scale(1.015); }
    }
    .velox-editor-pulso { animation: velox-editor-pulso .95s ease-out 1; }
    @media (prefers-reduced-motion: reduce) {
      .velox-editor-pulso { animation: none; outline: 2px solid rgba(220, 75, 55, .35); outline-offset: 3px; }
    }
    :root { --velox-page: #F6EFE5; --velox-surface: #FFFBF5; --velox-raised: #F0E3D5; --velox-inset: #F6EFE5; --velox-border: #D7C2AD; }
    body { background: radial-gradient(ellipse at 8% 0%, rgb(127 29 29 / 10%), transparent 26%), var(--velox-page); }
    .bg-slate-900 { background-color: var(--velox-inset) !important; }
    .bg-slate-800 { background-color: var(--velox-surface) !important; }
    .bg-slate-700 { background-color: var(--velox-raised) !important; }
    .border-slate-700, .border-slate-800 { border-color: var(--velox-border) !important; }
    /* Mantiene ocultos los elementos plegados aunque Tailwind tarde en arrancar. */
    #modal-personalizar.hidden, #modal-pedido.hidden, #barra-carrito.hidden { display: none !important; }
    body.pb-28 { padding-bottom: calc(7rem + env(safe-area-inset-bottom, 0px)); }
    #barra-carrito {
        position: fixed !important;
        top: auto !important;
        left: max(12px, env(safe-area-inset-left, 0px)) !important;
        right: max(12px, env(safe-area-inset-right, 0px)) !important;
        bottom: calc(14px + env(safe-area-inset-bottom, 0px)) !important;
        width: auto;
        max-width: 42rem;
        margin-left: auto;
        margin-right: auto;
        z-index: 40;
        box-sizing: border-box;
        padding: 6px;
        border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 22px;
        background: rgba(255, 251, 245, .96);
        box-shadow: 0 14px 40px rgba(0, 0, 0, .42);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        -webkit-transform: translate3d(0, 0, 0);
        transform: translate3d(0, 0, 0);
        will-change: transform;
    }
    #nombre-restaurante:empty { display: none; }
    /* Ocultar barra de desplazamiento en la barra de categorías */
    .carta-categorias-marco {
        position: relative;
        min-width: 0;
        flex: 1;
    }
    #navegacion-carta #contenedor-categorias {
        gap: .375rem;
        padding: .15rem .2rem;
        scrollbar-width: none;
    }
    #contenedor-categorias::-webkit-scrollbar { display: none; }
    #navegacion-carta #contenedor-categorias button {
        flex: 0 0 auto;
        max-width: 100%;
        min-height: 2.75rem;
        padding: .35rem .65rem;
        white-space: normal;
        overflow-wrap: anywhere;
        line-height: 1.15;
    }
    .carta-categorias-marco[data-mas]::after {
        content: "";
        position: absolute;
        inset: 0 0 0 auto;
        width: .85rem;
        pointer-events: none;
        background: linear-gradient(to right, transparent, var(--velox-surface));
    }
    #alternar-busqueda-carta {
        width: 2.75rem;
        height: 2.75rem;
        flex: none;
    }
    #alternar-busqueda-carta[aria-expanded="false"] .icono-cerrar-busqueda,
    #alternar-busqueda-carta[aria-expanded="true"] .icono-abrir-busqueda { display: none; }
    .velox-option-list {
        scrollbar-width: thin;
        scrollbar-color: rgba(165, 61, 36, .55) rgba(215, 194, 173, .7);
    }
    .velox-option-list::-webkit-scrollbar { width: 6px; }
    .velox-option-list::-webkit-scrollbar-track { background: rgba(215, 194, 173, .7); border-radius: 999px; }
    .velox-option-list::-webkit-scrollbar-thumb { background: rgba(165, 61, 36, .55); border-radius: 999px; }
    .velox-option:has(input:checked) {
        border-color: rgba(165, 61, 36, .85);
        background: linear-gradient(115deg, rgba(165, 61, 36, .14), rgba(246, 239, 229, .96));
        box-shadow: inset 0 0 0 1px rgba(165, 61, 36, .14), 0 8px 22px rgba(127, 29, 29, .12);
    }
    .velox-option:has(input:checked) .velox-option-title { color: #2B211B; }
    @keyframes menuCategoryFromRight {
        from { opacity: 0; transform: translate3d(34px, 0, 0) scale(.985); filter: blur(3px); }
        to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); filter: blur(0); }
    }
    @keyframes menuCategoryFromLeft {
        from { opacity: 0; transform: translate3d(-34px, 0, 0) scale(.985); filter: blur(3px); }
        to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); filter: blur(0); }
    }
    .menu-category-enter-next { animation: menuCategoryFromRight .34s cubic-bezier(.2,.75,.25,1) both; }
    .menu-category-enter-previous { animation: menuCategoryFromLeft .34s cubic-bezier(.2,.75,.25,1) both; }
    .menu-product-reveal {
        opacity: 0;
        transform: translateY(9px);
        transition: opacity .28s ease-out, transform .28s ease-out;
    }
    .menu-product-reveal.is-visible { opacity: 1; transform: translateY(0); }
    @media (prefers-reduced-motion: reduce) {
        .menu-category-enter-next, .menu-category-enter-previous { animation-duration: .01ms; }
        .menu-product-reveal { opacity: 1; transform: none; transition: none; }
    }
    .tarjeta-borrador-editable { position: relative; }
    .tarjeta-borrador-editar {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        background: transparent;
        border: 0;
        border-radius: inherit;
        cursor: pointer;
    }
    .tarjeta-borrador-editar:focus-visible {
        outline: 2px solid #A53D24;
        outline-offset: -3px;
    }
    html[data-ejemplo-producto] body { background:transparent !important; padding-bottom:0 !important; }
    html[data-ejemplo-producto] body > header, html[data-ejemplo-producto] #barra-carrito { display:none !important; }
    html[data-ejemplo-producto] #contenedor-menu { padding:0 !important; }
    html[data-ejemplo-producto] #contenedor-menu > div { margin:0 !important; }
    html[data-ejemplo-producto] #contenedor-menu h2 { display:none !important; }
    html[data-ejemplo-producto] #contenedor-menu .grid { grid-template-columns:1fr !important; margin-bottom:0 !important; }
    html[data-ejemplo-producto="opciones"] #contenedor-menu { display:none; }
  </style>

<body class="text-slate-100 min-h-screen pb-28">

    <!-- HEADER -->

                    <svg class="icono-abrir-busqueda" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
                    <svg class="icono-cerrar-busqueda" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>

            <div id="busqueda-carta" class="mt-2" hidden>

                <span id="resultados-busqueda-carta" role="status" class="sr-only"></span>

    <!-- CATÁLOGO -->
    <main class="max-w-7xl mx-auto p-4 md:px-6 space-y-4" id="contenedor-menu">
        <div id="estado-carga" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" aria-label="Cargando menú" role="status">
            <span class="sr-only">Cargando menú...</span>
            <div class="h-28 rounded-2xl border border-slate-800 bg-[#FFFBF5] animate-pulse"></div>
            <div class="h-28 rounded-2xl border border-slate-800 bg-[#FFFBF5] animate-pulse hidden sm:block"></div>
            <div class="h-28 rounded-2xl border border-slate-800 bg-[#FFFBF5] animate-pulse hidden lg:block"></div>

    <!-- BARRA CARRITO -->
    <div id="barra-carrito" class="fixed bottom-4 left-4 right-4 max-w-2xl mx-auto hidden z-40">
        <button onclick="abrirModalPedido()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-5 rounded-2xl shadow-xl shadow-red-950/30 flex items-center justify-between">
            <span class="bg-black/20 px-3 py-1 rounded-lg text-sm" id="cant-items">0 ítems</span>
            <span>Ver Pedido 🚀</span>
            <span id="total-carrito">$0</span>
        </button>
    </div>

   <!-- MODAL DE PERSONALIZACIÓN DE PRODUCTO -->
<div id="modal-personalizar" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4 z-[60]" role="dialog" aria-modal="true" aria-labelledby="titulo-personalizar">
    <form id="form-personalizar" onsubmit="confirmarPersonalizacion(event)" class="relative bg-[#F6EFE5] border border-red-900/50 rounded-3xl max-w-md w-full p-5 sm:p-6 shadow-[0_24px_80px_rgba(0,0,0,.65)] text-slate-100 max-h-[90vh] overflow-y-auto">
        <div class="absolute inset-x-8 top-0 h-px bg-gradient-to-r from-transparent via-red-500/80 to-transparent"></div>
        <div class="flex justify-between items-start gap-4 mb-5 border-b border-white/10 pb-4">

            <button id="cerrar-modal-personalizar" type="button" onclick="cerrarModalPersonalizar()" aria-label="Cerrar" class="h-9 w-9 shrink-0 rounded-full border border-white/10 bg-white/5 text-slate-400 hover:border-red-400/50 hover:bg-red-700/10 hover:text-white text-2xl leading-none transition">&times;</button>
        </div>

            <button id="aplicar-personalizacion" type="submit" class="w-2/3 bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-sm">Agregar al pedido</button>
        </div>
    </form>
</div>

   <!-- MODAL DE CONFIRMACIÓN DEL PEDIDO -->
<div id="modal-pedido" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-[#FFFBF5] border border-red-950/70 rounded-2xl max-w-md w-full p-6 shadow-2xl text-slate-100">
        <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
            <h3 class="text-xl font-bold text-white">Finalizar Pedido 🛒</h3>
            <button onclick="cerrarModalPedido()" class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
        </div>

        <!-- 1. LISTA DE PRODUCTOS DEL CARRITO (¡Esto es lo que faltaba agregar!) -->
        <div class="mb-4">
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Tus productos:</h4>
            <div id="lista-items-carrito" class="max-h-40 overflow-y-auto space-y-2 pr-1">
                <!-- Aquí se pintan los platos dinámicamente con JS -->
            </div>
            <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-800 font-bold">
                <span class="text-sm text-slate-300">Total estimado:</span>
            <span id="total-modal-carrito" class="text-white text-base">$0</span>
            </div>
        </div>

        <!-- 2. FORMULARIO DE DATOS DE ENVÍO -->
        <form id="form-confirmar-pedido" onsubmit="confirmarYEnviarPedido(event)" class="space-y-3">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Dirección de Entrega *</label>
                <input type="text" id="input-direccion" required placeholder="Ej: Calle 45 # 10-20" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Método de Pago *</label>
                <select id="select-pago" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm">
                    <option value="Efectivo">Efectivo contra entrega</option>
                    <option value="Transferencia (Nequi / Daviplata)">Transferencia (Nequi / Daviplata)</option>
                    <option value="Datáfono">Datáfono al entregar</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Notas especiales</label>
                <textarea id="input-notas" rows="2" placeholder="Ej: Sin cebolla..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm resize-none"></textarea>
            </div>
            <div class="pt-2 flex gap-3">
                <button type="button" onclick="cerrarModalPedido()" class="w-1/3 bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 rounded-xl text-sm transition">Cancelar</button>

</div>

    <dialog id="pedido-recibido" aria-labelledby="pedido-recibido-titulo" class="m-auto w-[90%] max-w-sm rounded-xl bg-[#FFFBF5] p-5 text-[#2B211B] backdrop:bg-black/60">
        <h2 id="pedido-recibido-titulo" class="text-xl font-bold">Pedido recibido</h2>
        <p id="pedido-referencia" class="mt-2 break-all text-sm"></p>
        <a id="pedido-whatsapp" class="mt-3 block text-red-400 underline">Abrir WhatsApp para hablar con el restaurante</a>
        <form method="dialog" class="mt-4"><button class="min-h-11 rounded-lg bg-red-600 px-4 text-white">Listo</button></form>
    </dialog>

    <script src="/app.menu-categorias.js?v=botones-aplicar-personalizacion"></script>
    <script>
        var cart = [];
        var numeroWhatsAppRestaurante = '';
        var ID_RESTAURANTE_ACTUAL = null;

       let todosLosProductos = [];
       let categoriasMenu = [];
       let indiceCategoriaActiva = -1;
       let direccionAnimacionMenu = 'next';
       let observadorTarjetasMenu = null;

window.VELOX_VISTA_BORRADOR = window.parent !== window
    && new URLSearchParams(window.location.search).get('vista') === 'borrador';

const modoEjemploProducto = window.VELOX_VISTA_BORRADOR && new URLSearchParams(window.location.search).get('ejemplo');
window.VELOX_EDITAR_PERSONALIZACION = false;
if(modoEjemploProducto) document.documentElement.dataset.ejemploProducto=modoEjemploProducto;

async function cargarMenu() {
    if (window.VELOX_VISTA_BORRADOR) return;
    var contenedor = document.getElementById('contenedor-menu');
    var urlParams = new URLSearchParams(window.location.search);
    var clienteSlug = urlParams.get('slug') || urlParams.get('r')
        || (window.location.pathname.startsWith('/c/') ? decodeURIComponent(window.location.pathname.slice(3)) : '');

    if (!clienteSlug) {
        contenedor.innerHTML = '<p class="text-center text-red-400 py-10">Error: No se especificó el restaurante.</p>';
        return;
    }

    let respuestaMenu;
    try {
        respuestaMenu = await fetch(`/api/menu/${encodeURIComponent(clienteSlug)}`, {
            headers: { 'Accept': 'application/json' }
        });
    } catch (error) {
        contenedor.innerHTML = '<p class="text-center text-red-400 py-10">No hay conexión para cargar el menú. Revisa tu internet e inténtalo de nuevo.</p>';
        return;
    }
    const datosMenu = await respuestaMenu.json().catch(() => ({}));
    const restData = datosMenu.restaurante;

    if (!respuestaMenu.ok || !restData || !Array.isArray(datosMenu.productos)) {
        contenedor.innerHTML = '<p class="text-center text-red-400 py-10">Restaurante no encontrado.</p>';
        return;
    }

    mostrarCartaMenu(restData, datosMenu.productos);
}

function mostrarCartaMenu(restData, productos) {
    const contenedorCategorias = document.getElementById('contenedor-categorias');
    const categoriaAnterior = window.VELOX_VISTA_BORRADOR ? categoriasMenu[indiceCategoriaActiva] : null;
    ID_RESTAURANTE_ACTUAL = restData.id;
    window.RESTAURANTE_ACTUAL = restData;
    window.MENU_DISPONIBLE = restData.menu_disponible !== false;
    const avisoServicio = document.getElementById('estado-servicio');
    if (avisoServicio && !window.MENU_DISPONIBLE) {
        avisoServicio.textContent = restData.mensaje_cierre || 'En este momento no estamos recibiendo pedidos.';
        avisoServicio.classList.remove('hidden');
    }
    var elNombre = document.getElementById('nombre-restaurante');
    if (elNombre) elNombre.innerText = restData.nombre_restaurante;
    document.title = `Carta digital de ${restData.nombre_restaurante || 'Restaurante'}`;

    todosLosProductos = productos.map(producto => ({
        ...producto,
        _categoriaOriginal: producto.categoria,
        categoria: resolverCategoriaCombo(producto)
    }));

    document.getElementById('navegacion-carta').hidden = !todosLosProductos.length;

    // Extraer categorías únicas para los botones superiores
    const categoriasSet = new Set();
    todosLosProductos.forEach(p => categoriasSet.add(p.categoria || 'General'));
    categoriasMenu = Array.from(categoriasSet);
    indiceCategoriaActiva = -1;
    
    let botonesHtml = '';
    categoriasMenu.forEach(cat => {
        botonesHtml += `<button type="button" data-categoria="${escaparHtml(cat)}" class="rounded-lg text-xs sm:text-sm font-semibold bg-[#FFF8EF] border border-slate-800 text-slate-200 hover:border-red-500 transition">${escaparHtml(cat)}</button>`;
    });
    contenedorCategorias.innerHTML = botonesHtml;
    if (!categoriaAnterior) contenedorCategorias.scrollLeft = 0;
    actualizarDesbordeCategorias();

    if (categoriasMenu.length) {
        filtrarCategoria(categoriasMenu.includes(categoriaAnterior) ? categoriaAnterior : categoriasMenu[0]);
    }
    else renderizarProductos(todosLosProductos);
}

function esNombreTamanoPizza(nombre) {
    const normalizado = normalizarTexto(nombre).replace(/\s+/g, ' ').trim();
    return /^(?:pizza\s+)?(?:porci(?:on|ones)|personal(?:\s+\d+)?|individual|mini|pequena|chica|mediana|grande|familiar(?:\s+\d+)?|jumbo|gigante)(?:\s*\(?\s*\d+(?:[.,]\d+)?\s*(?:cm|pulgadas?)\s*\)?)?$/.test(normalizado)
        || /^pizza\s+(?:de\s+)?\d+(?:[.,]\d+)?\s*(?:cm|pulgadas?)$/.test(normalizado);
}

function obtenerVisualProducto(producto) {
    const propia = (producto.imagen_url || '').trim();
    const valida = url => !url.includes('photo-1504674900247-0877df9cc836')
        && (url.startsWith('http') || (window.VELOX_VISTA_BORRADOR && url.startsWith(`blob:${window.location.origin}/`)));
    const url = propia;
    if (valida(url)) {
        return `<img src="${escaparHtml(url)}" alt="${escaparHtml(producto.nombre)}" loading="lazy" decoding="async" class="block w-full h-full object-contain">`;
    }

    const texto = `${producto.categoria || ''} ${producto.nombre || ''}`
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const visuales = [
        { claves: ['hamburg', 'burger'], iconos: ['🍔', '🍟', '🥪'], fondo: 'from-[#F0E3D5] via-[#FFFBF5] to-[#F6EFE5]' },
        { claves: ['arepa'], iconos: ['🫓', '🧀', '🌽'], fondo: 'from-[#F0E3D5] via-[#FFFBF5] to-[#F6EFE5]' },
        { claves: ['pizza'], iconos: ['🍕', '🧀', '🍅'], fondo: 'from-[#F0E3D5] via-[#FFFBF5] to-[#F6EFE5]' },

        tarjetas.forEach(tarjeta => tarjeta.classList.add('is-visible'));
        return;
    }
    observadorTarjetasMenu = new IntersectionObserver(entradas => {
        entradas.forEach(entrada => {
            if (!entrada.isIntersecting) return;
            entrada.target.classList.add('is-visible');
            observadorTarjetasMenu?.unobserve(entrada.target);
        });
    }, { threshold: 0.06, rootMargin: '0px 0px 32px 0px' });
    tarjetas.forEach(tarjeta => observadorTarjetasMenu.observe(tarjeta));
}
function filtrarCategoria(categoriaElegida) {
    const indiceAnterior = indiceCategoriaActiva;
    const nuevoIndice = categoriasMenu.indexOf(categoriaElegida);
    if (indiceAnterior >= 0 && nuevoIndice !== indiceAnterior) {
        direccionAnimacionMenu = nuevoIndice > indiceAnterior ? 'next' : 'previous';
    }
    indiceCategoriaActiva = nuevoIndice;
    const barra = document.getElementById('contenedor-categorias');
    const buscando = document.getElementById('buscar-plato-carta').value.trim();
    let seleccionado;
    for (const boton of barra.querySelectorAll('[data-categoria]')) {
        const coincide = boton.dataset.categoria === categoriaElegida;
        const activo = coincide && !buscando;
        boton.setAttribute('aria-pressed', String(Boolean(activo)));
        boton.classList.toggle('bg-red-600', Boolean(activo));
        if (coincide) seleccionado = boton;
    }
    if (seleccionado && !buscando && nuevoIndice !== indiceAnterior) {
        const visible = barra.getBoundingClientRect();
        const etiqueta = seleccionado.getBoundingClientRect();
        if (nuevoIndice === 0) barra.scrollLeft = 0;
        else if (etiqueta.left < visible.left) barra.scrollLeft += etiqueta.left - visible.left - 3;
        else if (etiqueta.right > visible.right - 10) barra.scrollLeft += etiqueta.right - visible.right + 10;
        actualizarDesbordeCategorias();
    }
    mostrarProductosCarta();
}

function mostrarProductosCarta() {
    const criterio = normalizarTexto(document.getElementById('buscar-plato-carta').value).trim();
    const estado = document.getElementById('resultados-busqueda-carta');
    if (!criterio) {
        estado.textContent = '';
        renderizarProductos(todosLosProductos.filter(p => p.categoria === categoriasMenu[indiceCategoriaActiva]));
        return;
    }

    const palabras = criterio.split(/\s+/);
    const coincidencias = todosLosProductos.filter(producto => {
        const texto = normalizarTexto([producto.nombre, producto.categoria, producto.descripcion].join(' '));
        return palabras.every(palabra => texto.includes(palabra));
    });
    estado.textContent = `${coincidencias.length} resultados en la carta`;
    renderizarProductos(coincidencias, 'No encontramos platos. Prueba otro nombre o ingrediente.');
}

function actualizarDesbordeCategorias() {
    const barra = document.getElementById('contenedor-categorias');
    const faltaAncho = barra.scrollWidth - barra.clientWidth - barra.scrollLeft > 3;
    document.getElementById('marco-categorias-carta').toggleAttribute('data-mas', faltaAncho);
}

function alternarBusquedaCarta(abrir, devolverFoco = false) {
    const panel = document.getElementById('busqueda-carta');
    const boton = document.getElementById('alternar-busqueda-carta');
    const campo = document.getElementById('buscar-plato-carta');
    panel.hidden = !abrir;
    boton.setAttribute('aria-expanded', String(abrir));
    boton.setAttribute('aria-label', abrir ? 'Cerrar búsqueda' : 'Buscar en la carta');
    if (abrir) campo.focus();
    else {
        campo.value = '';
        if (devolverFoco) {
            if (indiceCategoriaActiva >= 0) filtrarCategoria(categoriasMenu[indiceCategoriaActiva]);
            boton.focus();
        }
    }
}

const barraCategoriasCarta = document.getElementById('contenedor-categorias');
barraCategoriasCarta.addEventListener('scroll', actualizarDesbordeCategorias, { passive: true });
window.addEventListener('resize', actualizarDesbordeCategorias);
document.fonts?.ready.then(actualizarDesbordeCategorias);
document.getElementById('alternar-busqueda-carta').addEventListener('click', event => {
    const abrir = event.currentTarget.getAttribute('aria-expanded') === 'false';
    alternarBusquedaCarta(abrir, !abrir);
});
document.getElementById('navegacion-carta').addEventListener('keydown', event => {

});

document.getElementById('buscar-plato-carta').addEventListener('input', () => {

function cambiarCategoriaPorDeslizamiento(direccion) {
    if (!categoriasMenu.length || indiceCategoriaActiva < 0 || document.getElementById('buscar-plato-carta').value.trim()) return;
    const siguiente = Math.max(0, Math.min(categoriasMenu.length - 1, indiceCategoriaActiva + direccion));
    if (siguiente === indiceCategoriaActiva) return;
    filtrarCategoria(categoriasMenu[siguiente]);
}

habilitarDeslizamientoCategorias(document.getElementById('contenedor-menu'), cambiarCategoriaPorDeslizamiento);

function obtenerOpcionesProducto(producto) {
    const normalizarOpcion = opcion => {
        if (typeof opcion === 'string' || typeof opcion === 'number') {
            return { grupo: 'Variante', nombre: String(opcion).trim(), descripcion: '' };
        }
        if (opcion && typeof opcion === 'object') {
            return {
                grupo: String(opcion.grupo || opcion.tipo || opcion.categoria || 'Variante').trim(),
                nombre: String(opcion.nombre || opcion.nombre_opcion || opcion.valor || opcion.label || '').trim(),
                descripcion: String(opcion.descripcion || opcion.detalle || '').trim()
            };
        }
        return null;
    };
    if (Array.isArray(producto.opciones)) return producto.opciones
        .filter(opcion => !(opcion && typeof opcion === 'object' && opcion.grupo === '__velox_combo_family__'))
        .map(normalizarOpcion).filter(opcion => opcion && opcion.nombre);
    if (typeof producto.opciones === 'string') {
        try {
            const parsed = JSON.parse(producto.opciones);
            if (Array.isArray(parsed)) return obtenerOpcionesProducto({ opciones: parsed });
        } catch (error) {
            return producto.opciones.split(',').map(normalizarOpcion).filter(opcion => opcion && opcion.nombre);
        }
    }
    return [];
}

function esOpcionDeTamano(opcion) {
    const texto = normalizarTexto(opcion).trim();
    return /^(?:tamano\s*[:=-]?\s*)?(?:mini|pequena|pequeno|chica|chico|mediana|mediano|grande|familiar|personal|individual|junior|kids|infantil|regular|mediano|gigante|jumbo|extra grande|xl|xxl|(?:\d+(?:[.,]\d+)?\s*)(?:ml|l|lt|litro(?:s)?|gr|g|kg|cm| pulgadas?))$/i.test(texto)
        || /^(?:tamano\s*[:=-]?\s*)?(?:pequena|chica|mediana|grande|familiar|personal|individual|jumbo|extra grande|xl|xxl)\s*\(.*\)$/i.test(texto);
}

function quitarTamanoDeOpcion(opcion) {
    return String(opcion || '').trim()
        .replace(/\s*[-(]?\s*\d+(?:[.,]\d+)?\s*(?:ml|l|lt|litros?|gr|g|kg|cm|pulgadas?)\)?\s*$/i, '')
        .replace(/\s*[-–(]?\s*(?:tamaño\s*[:=-]?\s*)?(?:mini|pequeñ[ao]s?|chic[ao]s?|median[ao]s?|grandes?|familiar(?:es)?|personal(?:es)?|individual(?:es)?|junior|kids|infantil(?:es)?|regular|gigante|jumbo|extra grande|xl|xxl)\)?\s*$/i, '')
        .replace(/^\s*(?:tamaño\s*[:=-]?\s*)?(?:mini|pequeñ[ao]s?|chic[ao]s?|median[ao]s?|grandes?|familiar(?:es)?|personal(?:es)?|individual(?:es)?|junior|kids|infantil(?:es)?|regular|gigante|jumbo|extra grande|xl|xxl)\s*[-–:]\s*/i, '')
        .replace(/^\s*(?:tamaño\s*[:=-]?\s*)?(?:mini|pequeñ[ao]s?|chic[ao]s?|median[ao]s?|grandes?|familiar(?:es)?|personal(?:es)?|individual(?:es)?|junior|kids|infantil(?:es)?|regular|gigante|jumbo|extra grande|xl|xxl)\s+/i, '')
        .replace(/[\s,;:–-]+$/, '').trim();
}

function esEtiquetaOpcion(texto) {
    return /^(?:opciones?|variantes?|sabores?|ingredientes?|acompanamientos?|tamanos?|categorias?|elige|selecciona|a eleccion)$/i.test(normalizarTexto(texto).trim());
}

function opcionesValidasProducto(producto) {
    const categorias = new Set(todosLosProductos.map(p => normalizarTexto(p.categoria || '')).filter(Boolean));
    const unicas = new Map();
    obtenerOpcionesProducto(producto).forEach(opcion => {
        const grupo = opcion.grupo || 'Variante';
        const esVarianteGenerica = normalizarTexto(grupo) === 'variante';
        const nombre = esVarianteGenerica ? quitarTamanoDeOpcion(opcion.nombre) : opcion.nombre;
        const normalizada = normalizarTexto(nombre);
        if (!normalizada || (esVarianteGenerica && (esOpcionDeTamano(nombre) || esEtiquetaOpcion(nombre) || categorias.has(normalizada)))) return;
        const llave = `${normalizarTexto(grupo)}|${normalizada}`;
        if (!unicas.has(llave)) unicas.set(llave, { grupo, nombre, descripcion: opcion.descripcion || '', etiqueta: opcion.etiqueta || '' });
    });
    return [...unicas.values()];
}

function obtenerPersonalizacionProducto(producto) {
    const opcionesProducto = opcionesValidasProducto(producto);
    const grupos = new Map();
    opcionesProducto.forEach(opcion => {
        const grupo = opcion.grupo || 'Variante';
        if (!grupos.has(grupo)) grupos.set(grupo, []);
        grupos.get(grupo).push(opcion);
    });
    const selectores = [...grupos.entries()].map(([grupo, opciones]) => ({
        etiqueta: opciones.find(opcion=>String(opcion.etiqueta||'').trim())?.etiqueta || etiquetaPorDefectoGrupo(grupo),
        grupo,
        opciones
    }));

    return { selectores };
}

function textoBotonPersonalizacion(selectores) {
    return textoBotonVariantesCliente(selectores.map(selector=>selector.grupo));
}

function escaparHtml(valor) {
    return String(valor || '').replace(/[&<>"']/g, caracter => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[caracter]);
}

let productoPersonalizacionActual = null;
let gruposEditablesEjemplo = [];
let gruposOriginalesEdicionEjemplo = [];

function etiquetaPorDefectoGrupo(nombre) {
    return /^(sabor|sabores|especialidad|especialidades)$/i.test(normalizarTexto(nombre)) ? 'Elige un sabor' : `Elige ${String(nombre||'').toLowerCase()}`;
}

function agruparOpcionesParaEditar(producto) {
    const grupos=[];
    for(const entrada of Array.isArray(producto?.opciones)?producto.opciones:[]) {
        const opcion=typeof entrada==='string'?{grupo:'Variante',nombre:entrada,descripcion:''}:entrada;
        if(!opcion || typeof opcion!=='object' || String(opcion.grupo||'').startsWith('__')) continue;
        const nombreGrupo=String(opcion.grupo||'');
        let grupo=grupos.find(item=>item.nombre===nombreGrupo);
        if(!grupo) grupos.push(grupo={nombre:nombreGrupo,etiqueta:String(opcion.etiqueta||etiquetaPorDefectoGrupo(nombreGrupo)),opciones:[]});
        grupo.opciones.push({...opcion,nombre:String(opcion.nombre||''),descripcion:String(opcion.descripcion||'')});
    }
    return grupos;
}

function opcionesEditadasEjemplo() {
    return gruposEditablesEjemplo.flatMap(grupo=>
        grupo.opciones.length
          ? grupo.opciones.map(opcion=>({...opcion,grupo:grupo.nombre,etiqueta:grupo.etiqueta,nombre:opcion.nombre,descripcion:opcion.descripcion||''}))
          : [{grupo:grupo.nombre,etiqueta:grupo.etiqueta,nombre:'',descripcion:''}]
    );
}

function sincronizarOpcionesEditadasEjemplo() {
    if(!productoPersonalizacionActual) return;
    const opciones=opcionesEditadasEjemplo();
    productoPersonalizacionActual.producto.opciones=opciones;
    const indice=todosLosProductos.findIndex(item=>String(item.id)===String(productoPersonalizacionActual.producto.id));
    if(indice>=0) todosLosProductos[indice].opciones=opciones;
    window.parent.postMessage({tipo:'velox-editar-opciones-producto',opciones},window.location.origin);
}

function ultimaOpcionEditadaCompleta(grupo) {
    if(!grupo?.opciones?.length) return true;
    return Boolean(String(grupo.opciones[grupo.opciones.length-1].nombre||'').trim());
}

function nombreGrupoEditadoCompleto(grupo) {
    return Boolean(String(grupo?.nombre||'').trim() && !String(grupo.nombre).trim().startsWith('__'));
}

function renderizarEditorOpcionesEjemplo() {

        <span class="h-7 w-1 shrink-0 rounded-full bg-red-400"></span>
        <input type="text" maxlength="120" value="${escapar(grupo.etiqueta)}" placeholder="Ej. Elige un sabor" aria-label="Texto que verá el cliente para la elección ${i+1}" oninput="editarEtiquetaGrupoEjemplo(${i},this.value)" class="min-w-0 flex-1 bg-transparent py-1 text-base font-bold text-slate-800 placeholder:text-slate-500 focus:outline-none">
        <button type="button" aria-label="Eliminar grupo ${escapar(grupo.nombre||i+1)}" title="Eliminar grupo" onclick="quitarGrupoEjemplo(${i})" class="min-h-11 min-w-11 rounded-lg text-xl text-red-700">×</button>
      </div>
      <div class="velox-option-list max-h-[42vh] space-y-2 overflow-y-auto rounded-2xl border border-white/5 bg-black/15 p-2">
        ${grupo.opciones.map((opcion,j)=>`<label class="velox-option flex items-start gap-3 rounded-xl border border-slate-700/70 bg-[#FFF8EF] px-3.5 py-3 transition">
          <span aria-hidden="true" class="mt-0.5 h-4 w-4 shrink-0 rounded-full border-2 border-slate-400 bg-white"></span>
          <span class="min-w-0 flex-1">
            <input type="text" maxlength="200" value="${escapar(opcion.nombre)}" placeholder="Ej. Pollo desmechado" aria-label="Opción ${j+1} del grupo ${escapar(grupo.nombre||'nuevo')}" oninput="editarOpcionEjemplo(${i},${j},this.value)" class="block w-full min-w-0 border-0 bg-transparent p-0 text-sm font-bold leading-snug text-slate-900 placeholder:text-slate-500 focus:outline-none">
            ${opcion.descripcion ? `<span class="mt-1 block text-xs leading-relaxed text-slate-600">${escapar(opcion.descripcion)}</span>` : ''}
          </span>
          <button type="button" aria-label="Quitar opción ${escapar(opcion.nombre||j+1)}" title="Quitar opción" onclick="quitarOpcionEjemplo(${i},${j})" class="min-h-11 min-w-11 shrink-0 rounded-lg text-xl text-red-700">×</button>
        </label>`).join('')}
        <button type="button" data-ejemplo-agregar-opcion="${i}" onclick="agregarOpcionEjemplo(${i})" class="min-h-11 rounded-lg px-2 text-sm font-semibold text-red-700 disabled:cursor-not-allowed disabled:opacity-40">+ Añadir opción</button>
      </div>
    </section>`).join('');
    campos.innerHTML=`<p class="mb-4 rounded-xl border border-slate-700 bg-slate-900 px-3.5 py-2.5 text-xs leading-relaxed text-slate-600">Edita los nombres aquí. Así se verá esta elección en el menú del cliente.</p>${gruposHtml}<button type="button" id="ejemplo-agregar-grupo" onclick="agregarGrupoEjemplo()" class="mt-3 min-h-11 rounded-lg border border-slate-600 px-3 text-sm font-semibold text-slate-700 disabled:cursor-not-allowed disabled:opacity-40">+ Añadir grupo</button>`;
    gruposEditablesEjemplo.forEach((grupo,i)=>{
        const boton=campos.querySelector(`[data-ejemplo-agregar-opcion="${i}"]`);
        if(boton) boton.disabled=!ultimaOpcionEditadaCompleta(grupo);
    });
    const agregarGrupo=campos.querySelector('#ejemplo-agregar-grupo');
    const ultimo=gruposEditablesEjemplo[gruposEditablesEjemplo.length-1];
    if(agregarGrupo) agregarGrupo.disabled=Boolean(ultimo && !nombreGrupoEditadoCompleto(ultimo));
}

function editarEtiquetaGrupoEjemplo(i,valor) {
    if(!gruposEditablesEjemplo[i]) return;
    gruposEditablesEjemplo[i].etiqueta=valor;
    if(!String(gruposEditablesEjemplo[i].nombre||'').trim()) {
        gruposEditablesEjemplo[i].nombre=valor.trim().replace(/^elige\\s+/i,'').replace(/^(un|una)\\s+/i,'');
    }
    sincronizarOpcionesEditadasEjemplo();
    const boton=document.getElementById('ejemplo-agregar-grupo');
    const ultimo=gruposEditablesEjemplo[gruposEditablesEjemplo.length-1];
    if(boton) boton.disabled=Boolean(ultimo && !nombreGrupoEditadoCompleto(ultimo));
}

function editarOpcionEjemplo(i,j,valor) {
    if(!gruposEditablesEjemplo[i]?.opciones[j]) return;
    gruposEditablesEjemplo[i].opciones[j].nombre=valor;
    sincronizarOpcionesEditadasEjemplo();
    const boton=document.querySelector(`[data-ejemplo-agregar-opcion="${i}"]`);
    if(boton) boton.disabled=!ultimaOpcionEditadaCompleta(gruposEditablesEjemplo[i]);
}

function agregarGrupoEjemplo() {
    const anterior=gruposEditablesEjemplo[gruposEditablesEjemplo.length-1];
    if(anterior&&!nombreGrupoEditadoCompleto(anterior)) return;
    gruposEditablesEjemplo.push({nombre:'',opciones:[{nombre:'',descripcion:''}]});
    renderizarEditorOpcionesEjemplo();
    sincronizarOpcionesEditadasEjemplo();
    document.querySelector('#campos-personalizar .velox-editor-grupo:last-of-type > div > input')?.focus();
}

function agregarOpcionEjemplo(i) {
    const grupo=gruposEditablesEjemplo[i];
    if(!grupo||!ultimaOpcionEditadaCompleta(grupo)) return;
    grupo.opciones.push({nombre:'',descripcion:''});
    renderizarEditorOpcionesEjemplo();
    sincronizarOpcionesEditadasEjemplo();
    document.querySelectorAll('#campos-personalizar .velox-editor-grupo')[i]?.querySelectorAll('input')[grupo.opciones.length]?.focus();
}

function quitarOpcionEjemplo(i,j) {
    if(!gruposEditablesEjemplo[i]) return;
    gruposEditablesEjemplo[i].opciones.splice(j,1);
    renderizarEditorOpcionesEjemplo();
    sincronizarOpcionesEditadasEjemplo();
}

function quitarGrupoEjemplo(i) {
    gruposEditablesEjemplo.splice(i,1);
    renderizarEditorOpcionesEjemplo();
    sincronizarOpcionesEditadasEjemplo();
}

function abrirEditorPersonalizacionEjemplo(producto) {
    productoPersonalizacionActual={producto,selectores:[]};
    gruposEditablesEjemplo=agruparOpcionesParaEditar(producto);
    gruposOriginalesEdicionEjemplo=JSON.parse(JSON.stringify(gruposEditablesEjemplo));
    document.getElementById('etiqueta-personalizar').textContent='EDICIÓN EN VIVO';
    document.getElementById('titulo-personalizar').textContent='Personalizar este producto';
    document.getElementById('nombre-personalizar').textContent=producto.nombre||'Producto';
    document.getElementById('personalizar-acciones').hidden=false;
    document.getElementById('cancelar-personalizacion').textContent='Cancelar';
    document.getElementById('cancelar-personalizacion').setAttribute('onclick','cancelarEdicionPersonalizacionEjemplo()');
    document.getElementById('aplicar-personalizacion').textContent='Aplicar cambios';
    document.getElementById('cerrar-modal-personalizar').setAttribute('onclick','cancelarEdicionPersonalizacionEjemplo()');
    renderizarEditorOpcionesEjemplo();
    const modal=document.getElementById('modal-personalizar');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    document.querySelector('#campos-personalizar input')?.focus();
}

function cancelarEdicionPersonalizacionEjemplo() {
    if(productoPersonalizacionActual) {
        gruposEditablesEjemplo=JSON.parse(JSON.stringify(gruposOriginalesEdicionEjemplo));
        sincronizarOpcionesEditadasEjemplo();
    }
    cerrarModalPersonalizar();
}

function iniciarPersonalizacion(id) {
    if (window.MENU_DISPONIBLE === false) return;
    const producto = todosLosProductos.find(p => String(p.id) === String(id));
    if (!producto || producto.disponible === false) return;

    if(modoEjemploProducto==='tarjeta') { window.parent.postMessage({tipo:'velox-ejemplo-abrir'},window.location.origin); return; }
    if(modoEjemploProducto==='opciones' && window.VELOX_EDITAR_PERSONALIZACION) { abrirEditorPersonalizacionEjemplo(producto); return; }
    document.getElementById('personalizar-acciones').hidden=false;
    document.getElementById('cancelar-personalizacion').textContent='Cancelar';
    document.getElementById('cancelar-personalizacion').setAttribute('onclick','cerrarModalPersonalizar()');
    document.getElementById('aplicar-personalizacion').textContent='Agregar al pedido';
    document.getElementById('cerrar-modal-personalizar').setAttribute('onclick','cerrarModalPersonalizar()');
    document.getElementById('etiqueta-personalizar').textContent='Personaliza tu pedido';
    document.getElementById('titulo-personalizar').textContent='Elige cómo lo quieres';
    const personalizacion = obtenerPersonalizacionProducto(producto);
    const requiereEleccion = personalizacion.selectores.length > 0;

    if (!requiereEleccion) {
        agregarAlCarrito(producto.id, producto.nombre, producto.precio);
        return;
    }

    productoPersonalizacionActual = { producto, selectores: personalizacion.selectores };
    document.getElementById('nombre-personalizar').textContent = producto.nombre;
    const campos = document.getElementById('campos-personalizar');
    const html = personalizacion.selectores.map((selector, index) => {
        const idCampo = `opcion-personalizar-${index}`;
        const opcionesHtml = selector.opciones.map((opcion, opcionIndex) => `
            <label class="velox-option flex cursor-pointer items-start gap-3 rounded-xl border border-slate-700/70 bg-[#FFF8EF] px-3.5 py-3 transition hover:border-red-500/60 hover:bg-[#F0E3D5]">
                <input type="radio" name="${idCampo}" data-selector-index="${index}" value="${opcionIndex}" required class="mt-0.5 h-4 w-4 shrink-0 accent-red-500 focus:ring-2 focus:ring-red-400/50">
                <span class="min-w-0 flex-1">
                    <span class="velox-option-title block text-sm font-bold leading-snug text-slate-100 transition">${escaparHtml(opcion.nombre)}</span>
                    ${opcion.descripcion ? `<span class="mt-1 block text-xs leading-relaxed text-slate-400">${escaparHtml(opcion.descripcion)}</span>` : ''}
                </span>
            </label>
        `).join('');
        return `<section aria-labelledby="${idCampo}-label"><h4 id="${idCampo}-label" class="mb-2.5 flex items-center gap-2 text-sm font-bold text-slate-200"><span class="h-5 w-1 rounded-full bg-red-400"></span>${escaparHtml(selector.etiqueta)}</h4><div class="velox-option-list max-h-[42vh] space-y-2 overflow-y-auto rounded-2xl border border-white/5 bg-black/15 p-2">${opcionesHtml}</div></section>`;
    }).join('');
    campos.innerHTML = `<p class="mb-4 rounded-xl border border-slate-700 bg-slate-900 px-3.5 py-2.5 text-xs leading-relaxed text-slate-300">Selecciona una opción para cada grupo y luego agrégala al pedido.</p>${html}`;

    const modal = document.getElementById('modal-personalizar');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    setTimeout(() => campos.querySelector('input[type="radio"]')?.focus(), 50);
}

function cerrarModalPersonalizar() {
    const modal = document.getElementById('modal-personalizar');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    productoPersonalizacionActual = null;
    if(modoEjemploProducto==='opciones') window.parent.postMessage({tipo:'velox-ejemplo-cerrar'},window.location.origin);
}

function confirmarPersonalizacion(event) {
    event.preventDefault();
    if (!productoPersonalizacionActual) return;
    if(modoEjemploProducto==='opciones' && window.VELOX_EDITAR_PERSONALIZACION) {
        cerrarModalPersonalizar();
        return;
    }
    if(modoEjemploProducto) { cerrarModalPersonalizar(); return; }

    const { producto, selectores } = productoPersonalizacionActual;
    const selecciones = Array.from(document.querySelectorAll('#campos-personalizar input[type="radio"][required]:checked')).map(input => {
        const selector = selectores[Number(input.dataset.selectorIndex)];
        const opcion = selector?.opciones[Number(input.value)];
        if (!selector || !opcion) return '';
        return `${selector.grupo}: ${opcion.nombre}`;
    }).filter(Boolean);

    const nombreCompleto = `${producto.nombre}${selecciones.length ? ` (${selecciones.join(' · ')})` : ''}`;
    const item = cart.find(i => i.id === producto.id && i.nombre === nombreCompleto);
    if (item) item.cantidad++;
    else cart.push({ id: producto.id, nombre: nombreCompleto, precio: Number(producto.precio), cantidad: 1 });

    actualizarBarraCarrito();
    cerrarModalPersonalizar();
}

// Delegación de eventos: los botones siguen funcionando aunque se redibujen las tarjetas.
document.addEventListener('click', event => {
    const elemento = event.target instanceof Element ? event.target : null;
    const editarBorrador = elemento?.closest('#contenedor-menu [data-editar-borrador]');
    if (editarBorrador && window.VELOX_EDICION_BORRADOR) {
        window.parent.postMessage({
            tipo: 'velox-editar-producto-borrador',
            indice: Number(editarBorrador.dataset.editarBorrador.replace('borrador-', ''))
        }, window.location.origin);
        return;
    }
    const botonProducto = elemento?.closest('#contenedor-menu [data-action="personalizar"]');
    if (botonProducto) {
        event.preventDefault();
        iniciarPersonalizacion(botonProducto.dataset.productId);
        return;
    }

    const botonCategoria = elemento?.closest('#contenedor-categorias [data-categoria]');
    if (botonCategoria) {
        event.preventDefault();
        alternarBusquedaCarta(false);
        filtrarCategoria(botonCategoria.dataset.categoria);
    }
});

        function agregarAlCarrito(id, nombre, precio) {
            if (window.MENU_DISPONIBLE === false) return;
            var item = cart.find(function(i) { return i.id === id; });
            if (item) {
                item.cantidad++;
            } else {
                cart.push({ id: id, nombre: nombre, precio: precio, cantidad: 1 });
            }
            actualizarBarraCarrito();
        }

        function actualizarBarraCarrito() {
            var barra = document.getElementById('barra-carrito');
            var cantItems = document.getElementById('cant-items');
            var totalCarrito = document.getElementById('total-carrito');

            var totalCantidad = 0;
            var totalPrecio = 0;
            for (var i = 0; i < cart.length; i++) {
                totalCantidad += cart[i].cantidad;
                totalPrecio += (cart[i].precio * cart[i].cantidad);
            }

            if (totalCantidad > 0) {
                barra.classList.remove('hidden');
                cantItems.innerText = totalCantidad + (totalCantidad === 1 ? ' ítem' : ' ítems');
                totalCarrito.innerText = '$' + totalPrecio.toLocaleString('es-CO');
            } else {
                barra.classList.add('hidden');
            }
        }

       function abrirModalPedido() {
    if (window.MENU_DISPONIBLE === false) return;
    if (cart.length === 0) return;
    
    var modal = document.getElementById('modal-pedido');
    modal.classList.remove('hidden');
    modal.classList.add('flex');

    // Renderizar los items dentro del modal
    renderizarCarritoModal();
}

function renderizarCarritoModal() {
    // Busca o crea un contenedor para los items dentro de tu modal de pedido
    var contenedorItems = document.getElementById('lista-items-carrito');
    var totalModal = document.getElementById('total-modal-carrito');
    
    if (!contenedorItems) return;

    let html = '';
    let totalGeneral = 0;

    cart.forEach((item, index) => {
        let subtotal = item.precio * item.cantidad;
        totalGeneral += subtotal;

        html += `
            <div class="flex items-center justify-between bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 mb-2">
                <div class="flex-1 pr-2">
                    <h4 class="text-white font-bold text-sm">${escaparHtml(item.nombre)}</h4>
                    <p class="text-white text-xs font-semibold">$${item.precio.toLocaleString('es-CO')} c/u</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="cambiarCantidadItem(${index}, -1)" class="w-7 h-7 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-bold flex items-center justify-center">-</button>
                    <span class="text-white text-sm font-bold w-5 text-center">${item.cantidad}</span>
                    <button onclick="cambiarCantidadItem(${index}, 1)" class="w-7 h-7 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-bold flex items-center justify-center">+</button>
                    <button onclick="eliminarItemCarrito(${index})" class="ml-2 text-red-400 hover:text-red-300 text-xs p-1">🗑️</button>
                </div>
            </div>
        `;
    });

    contenedorItems.innerHTML = html;
    if (totalModal) totalModal.innerText = '$' + totalGeneral.toLocaleString('es-CO');
}

function cambiarCantidadItem(index, delta) {
    cart[index].cantidad += delta;
    if (cart[index].cantidad <= 0) {
        cart.splice(index, 1);
    }
    actualizarBarraCarrito();
    renderizarCarritoModal();
    
    // Si el carrito se quedó vacío, cerrar el modal automáticamente
    if (cart.length === 0) {
        cerrarModalPedido();
    }
}

function eliminarItemCarrito(index) {
    cart.splice(index, 1);
    actualizarBarraCarrito();
    renderizarCarritoModal();
    
    if (cart.length === 0) {
        cerrarModalPedido();
    }
}

        function cerrarModalPedido() {
            var modal = document.getElementById('modal-pedido');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

    let enviandoPedido = false;
    let intentoPedidoActual = null;

    function prepararIntentoPedido(datos) {
        const huella = JSON.stringify(datos);
        if (intentoPedidoActual?.huella === huella) return intentoPedidoActual.id;
        try {
            const guardado = JSON.parse(sessionStorage.getItem('velox-intento-pedido') || 'null');
            if (guardado?.huella === huella && /^[0-9a-f-]{36}$/i.test(guardado.id || '')) {
                intentoPedidoActual = guardado;
                return guardado.id;
            }
        } catch {}
        // Se conserva el mismo ID si hay un corte o una respuesta perdida.
        intentoPedidoActual = { huella, id: crypto.randomUUID() };
        try { sessionStorage.setItem('velox-intento-pedido', JSON.stringify(intentoPedidoActual)); } catch {}
        return intentoPedidoActual.id;
    }

    async function confirmarYEnviarPedido(event) {
        event.preventDefault();
        if (enviandoPedido || window.VELOX_VISTA_BORRADOR) return;
        if (window.MENU_DISPONIBLE === false) {
            alert(window.RESTAURANTE_ACTUAL?.mensaje_cierre || 'En este momento no estamos recibiendo pedidos.');
            return;
        }

        var direccion = document.getElementById('input-direccion').value.trim();
        var metodoPago = document.getElementById('select-pago').value;
        var notas = document.getElementById('input-notas').value.trim();
        if (cart.length === 0) return;

        if (!window.RESTAURANTE_ACTUAL || !window.RESTAURANTE_ACTUAL.id) {
            alert('⚠️ Error: No se encontró el restaurante en el sistema.');
            return;
        }

        enviandoPedido = true;
        var botonEnviar = document.querySelector('#form-confirmar-pedido button[type="submit"]');
        if (botonEnviar) {
            botonEnviar.disabled = true;
            botonEnviar.textContent = 'Registrando pedido…';
        }

        try {
            // El servidor consulta los productos y recalcula el total con los precios oficiales.
            var datosPedido = {
                restaurante_id: window.RESTAURANTE_ACTUAL.id,
                direccion, metodo_pago: metodoPago, notas,
                items: cart.map(item => ({ id: item.id, nombre: item.nombre, cantidad: item.cantidad }))
            };
            var solicitudId = prepararIntentoPedido(datosPedido);
            var respuesta = await fetch('/api/pedidos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...datosPedido, solicitud_id: solicitudId })
            });
            var resultado = await respuesta.json().catch(function() { return {}; });
            if (!respuesta.ok || !resultado.success) {
                alert(resultado.error || 'No se pudo registrar el pedido. Inténtalo de nuevo.');
                return;
            }

            var total = Number(resultado.total);
            var detallePedido = resultado.detalle;
            var nombreNegocio = resultado.nombre_restaurante || window.RESTAURANTE_ACTUAL.nombre_restaurante || 'Restaurante';
            var telefonoCrudo = resultado.telefono_restaurante || window.RESTAURANTE_ACTUAL.telefono || '';
            var telefonoNegocio = String(telefonoCrudo).replace(/\D/g, '');
            if (telefonoNegocio.length === 10) telefonoNegocio = '57' + telefonoNegocio;

            var mensajeWhatsapp = `*NUEVO PEDIDO - ${nombreNegocio}*\n\n` +
                `• *Dirección:* ${direccion}\n` +
                `• *Pedido:* ${detallePedido}\n` +
                `• *Total:* $ ${total.toLocaleString('es-CO')}\n` +
                `• *Pago:* ${metodoPago}\n` +
                (notas ? `• *Notas:* ${notas}\n` : '') +
                `\n*Referencia Velox Bot:* ${resultado.pedido_id}`;

            intentoPedidoActual = null;
            try { sessionStorage.removeItem('velox-intento-pedido'); } catch {}
            cart = [];
            if (typeof actualizarBarraCarrito === 'function') actualizarBarraCarrito();
            if (typeof cerrarModalPedido === 'function') cerrarModalPedido();

            document.getElementById('pedido-referencia').textContent = 'Referencia: ' + resultado.pedido_id;
            const whatsapp = document.getElementById('pedido-whatsapp');
            whatsapp.hidden = !telefonoNegocio;
            if (telefonoNegocio) whatsapp.href = 'https://wa.me/' + telefonoNegocio + '?text=' + encodeURIComponent(mensajeWhatsapp);
            document.getElementById('pedido-recibido').showModal();
        } catch (err) {
            console.error('Error inesperado al confirmar pedido:', err);
            alert('No se pudo registrar el pedido. Revisa tu conexión e inténtalo de nuevo.');
        } finally {
            enviandoPedido = false;
            if (botonEnviar) {
                botonEnviar.disabled = false;
                botonEnviar.textContent = 'Confirmar Pedido 🚀';
            }
        }
    }
        if (window.VELOX_VISTA_BORRADOR) {
            const formulario = document.getElementById('form-confirmar-pedido');
            const confirmar = formulario.querySelector('button[type="submit"]');
            confirmar.disabled = true;
            confirmar.textContent = 'Vista previa';
            window.addEventListener('message', event => {
                const datos = event.data;
                if (event.source !== window.parent || event.origin !== window.location.origin
                    || datos?.tipo !== 'velox-borrador-carta' || !Array.isArray(datos.productos)) return;

                window.VELOX_EDICION_BORRADOR = datos.editable === true;
                window.VELOX_EDITAR_PERSONALIZACION = datos.editarPersonalizacion === true;
                if(!modoEjemploProducto) cerrarModalPersonalizar();
                cerrarModalPedido();
                cart = [];
                actualizarBarraCarrito();
                mostrarCartaMenu({ nombre_restaurante: datos.restaurante || 'Tu restaurante' },
                    datos.productos.map((producto, indice) => ({ ...producto, id: `borrador-${indice}` })));
                if(modoEjemploProducto) {
                    if(datos.abrirOpciones && modoEjemploProducto==='opciones') iniciarPersonalizacion('borrador-0');
                    const avisarAltura=()=>window.parent.postMessage({tipo:'velox-ejemplo-altura',altura:document.getElementById('contenedor-menu').scrollHeight+4},window.location.origin);
                    requestAnimationFrame(avisarAltura);
                    document.querySelectorAll('#contenedor-menu img').forEach(img=>img.addEventListener('load',avisarAltura,{once:true}));
                    if(window.ResizeObserver) { window.observadorEjemplo?.disconnect();window.observadorEjemplo=new ResizeObserver(avisarAltura);window.observadorEjemplo.observe(document.getElementById('contenedor-menu')); }
                }
            });
        }
        window.cargarMenu = cargarMenu;
        window.onload = function() {
            cargarMenu();
        };
    </script>
