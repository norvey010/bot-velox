<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Digital | Velox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-28 font-sans">

  <!-- ENCABEZADO -->
  <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 sticky top-0 z-20">
    <div class="max-w-md mx-auto p-4 flex items-center space-x-3">
      <img id="logo-restaurante" class="w-12 h-12 rounded-full object-cover border-2 border-emerald-500 bg-slate-700" src="https://via.placeholder.com/100?text=Velox" alt="Logo">
      <div>
        <h1 id="nombre-restaurante" class="text-lg font-bold text-white leading-tight">Cargando menú...</h1>
        <p class="text-xs text-emerald-400 font-medium">● Pedidos directos a cocina</p>
      </div>
    </div>
  </header>

  <!-- CATÁLOGOS Y PRODUCTOS -->
  <main class="max-w-md mx-auto p-4 space-y-4" id="contenedor-productos">
    <p class="text-center text-slate-500 py-8 text-sm">Cargando catálogo...</p>
  </main>

  <!-- BARRA DE CARRITO FLOTANTE -->
  <div id="barra-carrito" class="fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 p-4 shadow-2xl z-30 hidden">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <span id="cantidad-items" class="bg-emerald-500 text-slate-950 font-bold text-xs px-2.5 py-1 rounded-full">0</span>
        <span id="total-precio" class="text-white font-bold text-lg ml-2">$0</span>
      </div>
      <button class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-5 py-2.5 rounded-xl transition shadow-lg shadow-emerald-500/20 text-sm">
        Enviar Pedido ➔
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ozailviyimrjmeprilbp.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96YWlsdml5aW1yam1lYnJpbGJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMTA5MTEsImV4cCI6MjEwMDY4NjkxMX0.rkWEtTGV4uFB_w62sC-vygZoLbfEgx_KKTSd9oS-5CM';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const restauranteSlug = urlParams.get('r') || 'demo';

    let carrito = [];

    async function cargarMenu() {
      try {
        // 1. Cargar restaurante por slug
        const { data: rest, error: errRest } = await supabaseClient
          .from('restaurantes')
          .select('*')
          .eq('slug', restauranteSlug)
          .maybeSingle();

        if (rest) {
          document.getElementById('nombre-restaurante').innerText = rest.nombre;
          if (rest.logo_url) document.getElementById('logo-restaurante').src = rest.logo_url;
        } else {
          document.getElementById('nombre-restaurante').innerText = "Velox Burger";
        }

        // 2. Cargar productos (por restaurante_id si existe, o todos si es prueba)
        let query = supabaseClient.from('productos').select('*');
        if (rest && rest.id) {
          query = query.eq('restaurante_id', rest.id);
        }

        const { data: productos, error: errProd } = await query;

        if (errProd) {
          console.error("Error cargando productos:", errProd);
        }

        renderizarProductos(productos || []);
      } catch (err) {
        console.error("Error general:", err);
      }
    }

    function renderizarProductos(productos) {
      const contenedor = document.getElementById('contenedor-productos');
      if (!productos || productos.length === 0) {
        contenedor.innerHTML = `<p class="text-center text-slate-500 py-8 text-sm">No hay productos disponibles por ahora.</p>`;
        return;
      }

      contenedor.innerHTML = productos.map(prod => `
        <div class="bg-slate-800 rounded-xl p-3 border border-slate-700/60 flex space-x-3 items-center">
          <img src="${prod.imagen_url || 'https://via.placeholder.com/150?text=Plato'}" class="w-20 h-20 rounded-lg object-cover bg-slate-700 flex-shrink-0">
          <div class="flex-1 min-w-0">
            <h3 class="font-bold text-white text-sm truncate">${prod.nombre}</h3>
            <p class="text-xs text-slate-400 line-clamp-2 mt-0.5">${prod.descripcion || ''}</p>
            <div class="flex justify-between items-center mt-2">
              <span class="text-emerald-400 font-bold text-sm">$${Number(prod.precio).toLocaleString()}</span>
              <button onclick="agregarProducto(${prod.id}, '${prod.nombre}', ${prod.precio})" class="bg-slate-700 hover:bg-emerald-500 hover:text-slate-950 text-slate-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition">
                + Agregar
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function agregarProducto(id, nombre, precio) {
      carrito.push({ id, nombre, precio });
      actualizarBarraCarrito();
    }

    function actualizarBarraCarrito() {
      const barra = document.getElementById('barra-carrito');
      if (carrito.length > 0) {
        barra.classList.remove('hidden');
        document.getElementById('cantidad-items').innerText = carrito.length;
        const total = carrito.reduce((acc, item) => acc + item.precio, 0);
        document.getElementById('total-precio').innerText = `$${total.toLocaleString()}`;
      } else {
        barra.classList.add('hidden');
      }
    }

    cargarMenu();
  </script>
</body>
</html>
