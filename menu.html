    <script>
        var SUPABASE_URL = 'https://ozailviyimrjmebrilbp.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_6YqFb_vPKTOFJZ9sp8AUzw_4aNLkH-l';
        var supabaseClient = null;
        var cart = [];
        var numeroWhatsAppRestaurante = '';
        var ID_RESTAURANTE_ACTUAL = null;

        if (window.supabase && window.supabase.createClient) {

       let todosLosProductos = [];

async function cargarMenu() {
    var contenedor = document.getElementById('contenedor-menu');
    var contenedorCategorias = document.getElementById('contenedor-categorias');
    var urlParams = new URLSearchParams(window.location.search);
    var clienteSlug = urlParams.get('slug') || urlParams.get('r');

    if (!clienteSlug) {
        contenedor.innerHTML = '<p class="text-center text-red-400 py-10">Error: No se especificó el restaurante.</p>';
        return;
    }

    if (!supabaseClient && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    let { data: restData, error: restError } = await supabaseClient
        .from('restaurantes')
        .select('*')
        .eq('slug', clienteSlug)
        .maybeSingle();

    if (restError || !restData) {
        contenedor.innerHTML = '<p class="text-center text-red-400 py-10">Restaurante no encontrado.</p>';
        return;
    }

    ID_RESTAURANTE_ACTUAL = restData.id;
    window.RESTAURANTE_ACTUAL = restData;
    var elNombre = document.getElementById('nombre-restaurante');
    if (elNombre) elNombre.innerText = restData.nombre_restaurante;

    // Forzamos la consulta de productos ordenada por ID para evitar datos cacheados
    let { data: productos, error: resProd } = await supabaseClient
        .from('productos')
        .select('*')
        .eq('restaurante_id', ID_RESTAURANTE_ACTUAL)
        .order('id', { ascending: true });

    if (resProd || !productos) {
        contenedor.innerHTML = '<p class="text-center text-red-400 py-6">No se pudieron cargar los productos.</p>';
        return;
    }

    todosLosProductos = productos.map(producto => ({
        ...producto,
        _categoriaOriginal: producto.categoria,
        categoria: resolverCategoriaCombo(producto, productos)
    }));

    // Extraer categorías únicas para los botones superiores
    const categoriasSet = new Set();
    todosLosProductos.forEach(p => categoriasSet.add(p.categoria || 'General'));
    
    let botonesHtml = `<button type="button" data-categoria="TODOS" class="shrink-0 px-5 py-2.5 rounded-xl text-sm font-bold bg-red-600 text-white transition shadow whitespace-nowrap">🌟 Todos</button>`;
    categoriasSet.forEach(cat => {
        const etiqueta = cat === 'Combos' ? '🎁 Todos los combos' : escaparHtml(cat);
        botonesHtml += `<button type="button" data-categoria="${escaparHtml(cat)}" class="shrink-0 px-5 py-2.5 rounded-xl text-sm font-semibold bg-[#141518] border border-slate-800 text-slate-200 hover:border-red-500 hover:text-white transition shadow whitespace-nowrap">${etiqueta}</button>`;
    });
    if (contenedorCategorias) contenedorCategorias.innerHTML = botonesHtml;

    renderizarProductos(todosLosProductos);
}

function obtenerVisualProducto(producto) {
    const url = (producto.imagen_url || '').trim();
    const esImagenGenericaAnterior = url.includes('photo-1504674900247-0877df9cc836');
    if (url.startsWith('http') && !esImagenGenericaAnterior) {
        return `<img src="${url}" alt="${producto.nombre}" loading="lazy" class="w-full h-full object-cover transition duration-500 group-hover:scale-105">`;
    }

    const texto = `${producto.categoria || ''} ${producto.nombre || ''}`
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const visuales = [
        { claves: ['hamburg', 'burger'], iconos: ['🍔', '🍟', '🥪'], fondo: 'from-red-950 via-orange-950 to-[#111214]' },
        { claves: ['arepa'], iconos: ['🫓', '🧀', '🌽'], fondo: 'from-amber-950 via-yellow-950 to-[#111214]' },
        { claves: ['pizza'], iconos: ['🍕', '🧀', '🍅'], fondo: 'from-red-950 via-rose-950 to-[#111214]' },
        { claves: ['bebida', 'jugo', 'gaseosa', 'limonada', 'coctel'], iconos: ['🥤', '🧃', '🍹'], fondo: 'from-cyan-950 via-blue-950 to-[#111214]' },
        { claves: ['pollo', 'broaster', 'alita'], iconos: ['🍗', '🍟', '🍗'], fondo: 'from-orange-950 via-amber-950 to-[#111214]' },
        { claves: ['perro', 'salchipapa', 'salchicha'], iconos: ['🌭', '🍟', '🌭'], fondo: 'from-yellow-950 via-orange-950 to-[#111214]' },
        { claves: ['postre', 'torta', 'helado', 'dulce'], iconos: ['🍰', '🍨', '🧁'], fondo: 'from-fuchsia-950 via-rose-950 to-[#111214]' },
        { claves: ['ensalada', 'vegetar', 'vegano'], iconos: ['🥗', '🥑', '🥬'], fondo: 'from-green-950 via-emerald-950 to-[#111214]' },
        { claves: ['pasta', 'lasana', 'lasagna'], iconos: ['🍝', '🧀', '🍅'], fondo: 'from-orange-950 via-red-950 to-[#111214]' },
        { claves: ['carne', 'parrilla', 'asado', 'chuzo'], iconos: ['🥩', '🍖', '🔥'], fondo: 'from-red-950 via-stone-900 to-[#111214]' }
    ];
    const visual = visuales.find(item => item.claves.some(clave => texto.includes(clave))) || {
        iconos: ['🍽️', '✨', '🥘'], fondo: 'from-amber-950 via-stone-900 to-[#111214]'
    };

    // Selección estable por producto: el mismo plato conserva su visual al recargar.
    const llave = String(producto.id || producto.nombre || 'menu');
    const hash = Array.from(llave).reduce((total, letra) => total + letra.charCodeAt(0), 0);
    const icono = visual.iconos[hash % visual.iconos.length];
    return `<div role="img" aria-label="Ilustración para ${producto.categoria || 'menú'}" class="relative w-full h-full flex items-center justify-center overflow-hidden bg-gradient-to-br ${visual.fondo}">
        <div class="absolute -right-8 -top-12 w-44 h-44 rounded-full border border-white/5"></div>
        <div class="absolute -left-10 -bottom-16 w-52 h-52 rounded-full border border-white/5"></div>
        <div class="absolute inset-0 opacity-[0.08]" style="background-image:radial-gradient(#fff 1px,transparent 1px);background-size:18px 18px"></div>
        <span class="relative drop-shadow-2xl text-7xl sm:text-8xl select-none">${icono}</span>
        <span class="absolute bottom-3 left-4 text-[10px] uppercase tracking-[.22em] font-bold text-white/45">${producto.categoria || 'Especialidad'}</span>
    </div>`;
}

function renderizarProductos(listaProds) {
    var contenedor = document.getElementById('contenedor-menu');
    
    if (!listaProds || listaProds.length === 0) {
        contenedor.innerHTML = `<p class="text-center text-slate-400 p-6">No hay productos disponibles.</p>`;
        return;
    }

    const productosPorCategoria = {};
    listaProds.forEach(prod => {
        const cat = resolverCategoriaCombo(prod, todosLosProductos);
        if (!productosPorCategoria[cat]) {
            productosPorCategoria[cat] = [];
        }
        productosPorCategoria[cat].push(prod);
    });

    var html = '';
    for (const [categoria, lista] of Object.entries(productosPorCategoria)) {
        const esCategoriaCombos = categoria === 'Combos';
        const tituloCategoria = esCategoriaCombos ? 'Todos los combos' : categoria;
        const productosPorFamilia = new Map();
        if (esCategoriaCombos) {
            lista.forEach(producto => {
                const familia = resolverFamiliaCombo(producto);
                if (!productosPorFamilia.has(familia)) productosPorFamilia.set(familia, []);
                productosPorFamilia.get(familia).push(producto);
            });
        } else {
            productosPorFamilia.set('', lista);
        }

        html += `<div class="mb-8"><h2 class="text-2xl md:text-3xl font-extrabold text-white border-b border-slate-800 pb-3 mb-5 tracking-tight"><span class="text-amber-400">✦</span> ${escaparHtml(tituloCategoria)}</h2>`;
        for (const [familia, productosFamilia] of productosPorFamilia) {
            if (esCategoriaCombos) {
                html += `<h3 class="text-lg md:text-xl font-bold text-amber-300 mt-6 mb-3">${escaparHtml(familia)}</h3>`;
            }
            html += '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-5">';
            productosFamilia.forEach(producto => {
            const visualProducto = obtenerVisualProducto(producto);

            const personalizacion = obtenerPersonalizacionProducto(producto);
            const requierePersonalizacion = personalizacion.selectores.length > 0;
            const textoBoton = requierePersonalizacion ? textoBotonPersonalizacion(personalizacion.selectores) : '+ Agregar';
            const botonHtml = `
                <button type="button" data-action="personalizar" data-product-id="${escaparHtml(producto.id)}" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-4 rounded-xl text-sm transition shadow-lg shadow-red-950/30">
                    ${textoBoton}
                </button>
            `;

            html += `
                <div class="group bg-[#111214] rounded-2xl overflow-hidden border border-slate-800 hover:border-red-900/80 shadow-lg shadow-black/20 transition duration-200 hover:-translate-y-0.5 flex flex-col">
                    <div class="h-48 sm:h-44 bg-[#090a0c] overflow-hidden">${visualProducto}</div>
                    <div class="p-4 flex flex-col flex-1">
                        <div class="flex-1">
                            <h3 class="font-extrabold text-white text-lg leading-snug">${producto.nombre}</h3>
                            <p class="text-sm text-slate-400 mt-1.5 leading-relaxed lowercase">${producto.descripcion || 'Sin descripción'}</p>
                        </div>
                        <div class="mt-5 flex flex-col gap-3">
                            <span class="font-extrabold text-amber-400 text-xl">$${Number(producto.precio).toLocaleString('es-CO')}</span>
                            ${botonHtml}
                        </div>
                    </div>
                </div>
            `;
            });
            html += '</div>';
        }
        html += '</div>';
    }

    contenedor.innerHTML = html;
}
function filtrarCategoria(categoriaElegida) {
    document.querySelectorAll('#contenedor-categorias [data-categoria]').forEach(boton => {
        const activa = boton.dataset.categoria === categoriaElegida;
        boton.className = activa
            ? 'shrink-0 px-5 py-2.5 rounded-xl text-sm font-bold bg-red-600 text-white transition shadow whitespace-nowrap'
            : 'shrink-0 px-5 py-2.5 rounded-xl text-sm font-semibold bg-[#141518] border border-slate-800 text-slate-200 hover:border-red-500 hover:text-white transition shadow whitespace-nowrap';
    });
    if (categoriaElegida === 'TODOS') {
        renderizarProductos(todosLosProductos);
    } else {
        const filtrados = todosLosProductos.filter(p => resolverCategoriaCombo(p, todosLosProductos) === categoriaElegida);
        renderizarProductos(filtrados);
    }
}

function normalizarTexto(valor) {
    return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function resolverCategoriaCombo(producto, productosMenu = todosLosProductos) {
    return esProductoCombo(producto) ? 'Combos' : String(producto._categoriaOriginal || producto.categoria || 'General').trim();
}

function esProductoCombo(producto) {
    const categoria = normalizarTexto(producto._categoriaOriginal || producto.categoria || '');
    const nombre = normalizarTexto(producto.nombre || '');
    const descripcion = normalizarTexto(producto.descripcion || '');
    const tieneMarcador = obtenerMetadataFamiliaCombo(producto) !== '';
    if (tieneMarcador || /\bcombos?\b/.test(categoria) || /\bcombo\b/.test(nombre) || /\bcombo\b/.test(descripcion)) return true;

    // Compatibilidad con combos que versiones anteriores guardaron dentro de
    // su categoría normal; las señales deben aparecer juntas para evitar mover
    // hamburguesas o platos individuales por error.
    const incluyeBebida = /\b(?:gaseosa|bebida|refresco)\b/.test(descripcion);
    const incluyeAcompanamiento = /\b(?:papas?|papa francesa|yuca|patacon|arepa|ensalada)\b/.test(descripcion);
    return incluyeBebida && incluyeAcompanamiento && /\b(?:hamburguesa|perro|pollo|broaster|lasana|pizza|combo)\b/.test(nombre);
}

function obtenerMetadataFamiliaCombo(producto) {
    const opciones = Array.isArray(producto.opciones) ? producto.opciones : (() => {
        try { return JSON.parse(producto.opciones || '[]'); } catch (error) { return []; }
    })();
    const marcador = opciones.find(opcion => opcion && opcion.grupo === '__velox_combo_family__');
    return String(marcador?.nombre || producto.familia_combo || '').trim();
}

function resolverFamiliaCombo(producto) {
    const familiaGuardada = obtenerMetadataFamiliaCombo(producto);
    const detectarFamiliaPrincipal = texto => {
        const normalizado = normalizarTexto(texto);
        const familias = [
            { patron: /\b(?:arroces|arroz(?:\s+(?:chino|paisa|mixto|especial|con pollo|tres delicias))?)\b/, nombre: 'Arroces' },
            { patron: /\b(?:perros?|hot\s?dog)\b/, nombre: 'Perros' },
            { patron: /\b(?:hamburguesas?|burgers?)\b/, nombre: 'Hamburguesas' },
            { patron: /\bpizzas?\b/, nombre: 'Pizzas' },
            { patron: /\b(?:lasagna|lasana)\b/, nombre: 'Lasaña' },
            { patron: /\barepas?\b/, nombre: 'Arepas' },
            { patron: /\bsalchipapas?\b/, nombre: 'Salchipapas' },
            { patron: /\b(?:sandwiches?|emparedados?)\b/, nombre: 'Sándwiches' },
            { patron: /\b(?:tacos?|burritos?)\b/, nombre: 'Mexicanos' },
            { patron: /\b(?:pollo|broaster|alitas?|nuggets?)\b/, nombre: 'Pollo a la Broaster' },
            { patron: /\b(?:pescado|marisco)\b/, nombre: 'Pescados y mariscos' }
        ];
        return familias.find(familia => familia.patron.test(normalizado))?.nombre || '';
    };

    // Si el título identifica el plato principal, tiene prioridad sobre la descripción.
    const familiaPorNombre = detectarFamiliaPrincipal(producto.nombre);
    if (familiaPorNombre) return familiaPorNombre;

    // En títulos genéricos (Combo 1/Promoción 4), agrupa por el primer plato de la descripción.
    const primerComponente = String(producto.descripcion || '').split(/[,;+]/, 1)[0];
    const familiaPorInicioDescripcion = detectarFamiliaPrincipal(primerComponente);
    if (familiaPorInicioDescripcion) return familiaPorInicioDescripcion;

    if (familiaGuardada && normalizarTexto(familiaGuardada) !== 'otros') return familiaGuardada;
    return detectarFamiliaPrincipal(producto.descripcion) || 'Otros';
}

function obtenerOpcionesProducto(producto) {
    const normalizarOpcion = opcion => {
        if (typeof opcion === 'string' || typeof opcion === 'number') {
            return { grupo: 'Variante', nombre: String(opcion).trim(), descripcion: '' };
        }
        if (opcion && typeof opcion === 'object') {
            return {
                grupo: String(opcion.grupo || opcion.tipo || opcion.categoria || 'Variante').trim(),
                nombre: String(opcion.nombre || opcion.nombre_opcion || opcion.valor || opcion.label || '').trim(),
                descripcion: String(opcion.descripcion || opcion.detalle || '').trim()
            };
        }
        return null;
    };
    if (Array.isArray(producto.opciones)) return producto.opciones
        .filter(opcion => !(opcion && typeof opcion === 'object' && opcion.grupo === '__velox_combo_family__'))
        .map(normalizarOpcion).filter(opcion => opcion && opcion.nombre);
    if (typeof producto.opciones === 'string') {
        try {
            const parsed = JSON.parse(producto.opciones);
            if (Array.isArray(parsed)) return obtenerOpcionesProducto({ opciones: parsed });
        } catch (error) {
            return producto.opciones.split(',').map(normalizarOpcion).filter(opcion => opcion && opcion.nombre);
        }
    }
    return [];
}

function esOpcionDeTamano(opcion) {
    const texto = normalizarTexto(opcion).trim();
    return /^(?:tamano\s*[:=-]?\s*)?(?:mini|pequena|pequeno|chica|chico|mediana|mediano|grande|familiar|personal|individual|junior|kids|infantil|regular|mediano|gigante|jumbo|extra grande|xl|xxl|(?:\d+(?:[.,]\d+)?\s*)(?:ml|l|lt|litro(?:s)?|gr|g|kg|cm| pulgadas?))$/i.test(texto)
        || /^(?:tamano\s*[:=-]?\s*)?(?:pequena|chica|mediana|grande|familiar|personal|individual|jumbo|extra grande|xl|xxl)\s*\(.*\)$/i.test(texto);
}

function quitarTamanoDeOpcion(opcion) {
    return String(opcion || '').trim()
        .replace(/\s*[-(]?\s*\d+(?:[.,]\d+)?\s*(?:ml|l|lt|litros?|gr|g|kg|cm|pulgadas?)\)?\s*$/i, '')
        .replace(/\s*[-–(]?\s*(?:tamaño\s*[:=-]?\s*)?(?:mini|pequeñ[ao]s?|chic[ao]s?|median[ao]s?|grandes?|familiar(?:es)?|personal(?:es)?|individual(?:es)?|junior|kids|infantil(?:es)?|regular|gigante|jumbo|extra grande|xl|xxl)\)?\s*$/i, '')
        .replace(/^\s*(?:tamaño\s*[:=-]?\s*)?(?:mini|pequeñ[ao]s?|chic[ao]s?|median[ao]s?|grandes?|familiar(?:es)?|personal(?:es)?|individual(?:es)?|junior|kids|infantil(?:es)?|regular|gigante|jumbo|extra grande|xl|xxl)\s*[-–:]\s*/i, '')
        .replace(/^\s*(?:tamaño\s*[:=-]?\s*)?(?:mini|pequeñ[ao]s?|chic[ao]s?|median[ao]s?|grandes?|familiar(?:es)?|personal(?:es)?|individual(?:es)?|junior|kids|infantil(?:es)?|regular|gigante|jumbo|extra grande|xl|xxl)\s+/i, '')
        .replace(/[\s,;:–-]+$/, '').trim();
}

function esEtiquetaOpcion(texto) {
    return /^(?:opciones?|variantes?|sabores?|ingredientes?|acompanamientos?|tamanos?|categorias?|elige|selecciona|a eleccion)$/i.test(normalizarTexto(texto).trim());
}

function opcionesValidasProducto(producto) {
    const categorias = new Set(todosLosProductos.map(p => normalizarTexto(p.categoria || '')).filter(Boolean));
    const unicas = new Map();
    obtenerOpcionesProducto(producto).forEach(opcion => {
        const nombre = quitarTamanoDeOpcion(opcion.nombre);
        const normalizada = normalizarTexto(nombre);
        if (!normalizada || esOpcionDeTamano(nombre) || esEtiquetaOpcion(nombre) || categorias.has(normalizada)) return;
        const grupo = opcion.grupo || 'Variante';
        const llave = `${normalizarTexto(grupo)}|${normalizada}`;
        if (!unicas.has(llave)) unicas.set(llave, { grupo, nombre, descripcion: opcion.descripcion || '' });
    });
    return [...unicas.values()];
}

function productoMencionaBebida(texto) {
    return /\b(?:gaseosa|gaseosas|refresco|refrescos|bebida|bebidas|soda|sodas|jugo|jugos|limonada|limonadas|agua|aguas|cerveza|cervezas)\b/.test(texto);
}

function obtenerBebidasDisponibles() {
    return [...new Set(todosLosProductos
        .filter(producto => /\b(?:bebidas?|gaseosas?|refrescos?|jugos?|limonadas?|aguas?|cervezas?)\b/.test(normalizarTexto(producto.categoria || '')))
        .map(producto => quitarTamanoDeOpcion(producto.nombre))
        .filter(nombre => nombre && !esOpcionDeTamano(nombre)))];
}

function obtenerPersonalizacionProducto(producto) {
    const opcionesProducto = opcionesValidasProducto(producto);
    const texto = normalizarTexto(`${producto.nombre || ''} ${producto.descripcion || ''}`);
    const bebidasDisponibles = obtenerBebidasDisponibles();
    const mencionaBebidaDelMenu = bebidasDisponibles.some(bebida => bebida.length >= 3 && texto.includes(normalizarTexto(bebida)));
    const esComboConBebida = /\b(?:combo|combos|incluye|con)\b/.test(texto)
        && (productoMencionaBebida(texto) || mencionaBebidaDelMenu);
    const grupos = new Map();
    opcionesProducto.forEach(opcion => {
        const grupo = opcion.grupo || 'Variante';
        if (!grupos.has(grupo)) grupos.set(grupo, []);
        grupos.get(grupo).push(opcion);
    });
    if (esComboConBebida && bebidasDisponibles.length) {
        grupos.set('Bebida', bebidasDisponibles.map(nombre => ({ grupo: 'Bebida', nombre, descripcion: '' })));
    }
    const selectores = [...grupos.entries()].map(([grupo, opciones]) => ({
        etiqueta: /^(sabor|sabores|especialidad|especialidades)$/i.test(normalizarTexto(grupo)) ? 'Elige un sabor' : `Elige ${grupo.toLowerCase()}`,
        grupo,
        opciones
    }));

    return { selectores };
}

function textoBotonPersonalizacion(selectores) {
    if (selectores.length && selectores.every(selector => /^(sabor|sabores|especialidad|especialidades)$/i.test(normalizarTexto(selector.grupo)))) {
        return 'Elegir sabores';
    }
    return selectores.length > 1 ? 'Elegir opciones' : 'Elegir variante';
}

function escaparHtml(valor) {
    return String(valor || '').replace(/[&<>"']/g, caracter => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[caracter]);
}

let productoPersonalizacionActual = null;

function iniciarPersonalizacion(id) {
    const producto = todosLosProductos.find(p => String(p.id) === String(id));
    if (!producto) return;

    const personalizacion = obtenerPersonalizacionProducto(producto);
    const requiereEleccion = personalizacion.selectores.length > 0;

    if (!requiereEleccion) {
        agregarAlCarrito(producto.id, producto.nombre, producto.precio);
        return;
    }

    productoPersonalizacionActual = { producto, selectores: personalizacion.selectores };
    document.getElementById('nombre-personalizar').textContent = producto.nombre;
    const campos = document.getElementById('campos-personalizar');
    const html = personalizacion.selectores.map((selector, index) => {
        const idCampo = `opcion-personalizar-${index}`;
        const opcionesHtml = selector.opciones.map((opcion, opcionIndex) => `
            <label class="velox-option flex cursor-pointer items-start gap-3 rounded-xl border border-slate-700/70 bg-[#17191d] px-3.5 py-3 transition hover:border-red-500/60 hover:bg-[#1d1a1c]">
                <input type="radio" name="${idCampo}" data-selector-index="${index}" value="${opcionIndex}" required class="mt-0.5 h-4 w-4 shrink-0 accent-red-500 focus:ring-2 focus:ring-red-400/50">
                <span class="min-w-0 flex-1">
                    <span class="velox-option-title block text-sm font-bold leading-snug text-slate-100 transition">${escaparHtml(opcion.nombre)}</span>
                    ${opcion.descripcion ? `<span class="mt-1 block text-xs leading-relaxed text-slate-400">${escaparHtml(opcion.descripcion)}</span>` : ''}
                </span>
            </label>
        `).join('');
        return `<section aria-labelledby="${idCampo}-label"><h4 id="${idCampo}-label" class="mb-2.5 flex items-center gap-2 text-sm font-bold text-slate-200"><span class="h-5 w-1 rounded-full bg-gradient-to-b from-red-500 to-amber-400"></span>${escaparHtml(selector.etiqueta)}</h4><div class="velox-option-list max-h-[42vh] space-y-2 overflow-y-auto rounded-2xl border border-white/5 bg-black/15 p-2">${opcionesHtml}</div></section>`;
    }).join('');
    campos.innerHTML = `<p class="mb-4 rounded-xl border border-amber-400/15 bg-amber-400/[.06] px-3.5 py-2.5 text-xs leading-relaxed text-slate-300">Selecciona una opción para cada grupo y luego agrégala al pedido.</p>${html}`;

    const modal = document.getElementById('modal-personalizar');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    setTimeout(() => campos.querySelector('input[type="radio"]')?.focus(), 50);
}

function cerrarModalPersonalizar() {
    const modal = document.getElementById('modal-personalizar');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    productoPersonalizacionActual = null;
}

function confirmarPersonalizacion(event) {
    event.preventDefault();
    if (!productoPersonalizacionActual) return;

    const { producto, selectores } = productoPersonalizacionActual;
    const selecciones = Array.from(document.querySelectorAll('#campos-personalizar input[type="radio"][required]:checked')).map(input => {
        const selector = selectores[Number(input.dataset.selectorIndex)];
        const opcion = selector?.opciones[Number(input.value)];
        if (!selector || !opcion) return '';
        return `${selector.grupo}: ${opcion.nombre}${opcion.descripcion ? ` — ${opcion.descripcion}` : ''}`;
    }).filter(Boolean);

    const nombreCompleto = `${producto.nombre}${selecciones.length ? ` (${selecciones.join(' · ')})` : ''}`;
    const item = cart.find(i => i.id === producto.id && i.nombre === nombreCompleto);
    if (item) item.cantidad++;
    else cart.push({ id: producto.id, nombre: nombreCompleto, precio: Number(producto.precio), cantidad: 1 });

    actualizarBarraCarrito();
    cerrarModalPersonalizar();
}

// Delegación de eventos: los botones siguen funcionando aunque se redibujen las tarjetas.
document.addEventListener('click', event => {
    const elemento = event.target instanceof Element ? event.target : null;
    const botonProducto = elemento?.closest('#contenedor-menu [data-action="personalizar"]');
    if (botonProducto) {
        event.preventDefault();
        iniciarPersonalizacion(botonProducto.dataset.productId);
        return;
    }

    const botonCategoria = elemento?.closest('#contenedor-categorias [data-categoria]');
    if (botonCategoria) {
        event.preventDefault();
        filtrarCategoria(botonCategoria.dataset.categoria);
    }
});

        function agregarAlCarrito(id, nombre, precio) {
            var item = cart.find(function(i) { return i.id === id; });
            if (item) {
                item.cantidad++;
            } else {
                cart.push({ id: id, nombre: nombre, precio: precio, cantidad: 1 });
            }
            actualizarBarraCarrito();
        }

        function actualizarBarraCarrito() {
            var barra = document.getElementById('barra-carrito');
            var cantItems = document.getElementById('cant-items');
            var totalCarrito = document.getElementById('total-carrito');

            var totalCantidad = 0;
            var totalPrecio = 0;
            for (var i = 0; i < cart.length; i++) {
                totalCantidad += cart[i].cantidad;
                totalPrecio += (cart[i].precio * cart[i].cantidad);
            }

            if (totalCantidad > 0) {
                barra.classList.remove('hidden');
                cantItems.innerText = totalCantidad + (totalCantidad === 1 ? ' ítem' : ' ítems');
                totalCarrito.innerText = '$' + totalPrecio.toLocaleString('es-CO');
            } else {
                barra.classList.add('hidden');
            }
        }

       function abrirModalPedido() {
    if (cart.length === 0) return;
    
    var modal = document.getElementById('modal-pedido');
    modal.classList.remove('hidden');
    modal.classList.add('flex');

    // Renderizar los items dentro del modal
    renderizarCarritoModal();
}

function renderizarCarritoModal() {
    // Busca o crea un contenedor para los items dentro de tu modal de pedido
    var contenedorItems = document.getElementById('lista-items-carrito');
    var totalModal = document.getElementById('total-modal-carrito');
    
    if (!contenedorItems) return;

    let html = '';
    let totalGeneral = 0;

    cart.forEach((item, index) => {
        let subtotal = item.precio * item.cantidad;
        totalGeneral += subtotal;

        html += `
            <div class="flex items-center justify-between bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 mb-2">
                <div class="flex-1 pr-2">
                    <h4 class="text-white font-bold text-sm">${escaparHtml(item.nombre)}</h4>
                    <p class="text-amber-400 text-xs font-semibold">$${item.precio.toLocaleString('es-CO')} c/u</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="cambiarCantidadItem(${index}, -1)" class="w-7 h-7 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-bold flex items-center justify-center">-</button>
                    <span class="text-white text-sm font-bold w-5 text-center">${item.cantidad}</span>
                    <button onclick="cambiarCantidadItem(${index}, 1)" class="w-7 h-7 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-bold flex items-center justify-center">+</button>
                    <button onclick="eliminarItemCarrito(${index})" class="ml-2 text-red-400 hover:text-red-300 text-xs p-1">🗑️</button>
                </div>
            </div>
        `;
    });

    contenedorItems.innerHTML = html;
    if (totalModal) totalModal.innerText = '$' + totalGeneral.toLocaleString('es-CO');
}

function cambiarCantidadItem(index, delta) {
    cart[index].cantidad += delta;
    if (cart[index].cantidad <= 0) {
        cart.splice(index, 1);
    }
    actualizarBarraCarrito();
    renderizarCarritoModal();
    
    // Si el carrito se quedó vacío, cerrar el modal automáticamente
    if (cart.length === 0) {
        cerrarModalPedido();
    }
}

function eliminarItemCarrito(index) {
    cart.splice(index, 1);
    actualizarBarraCarrito();
    renderizarCarritoModal();
    
    if (cart.length === 0) {
        cerrarModalPedido();
    }
}

        function cerrarModalPedido() {
            var modal = document.getElementById('modal-pedido');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

    async function confirmarYEnviarPedido(event) {
    event.preventDefault();

    var direccion = document.getElementById('input-direccion').value;
    var metodoPago = document.getElementById('select-pago').value;
    var notas = document.getElementById('input-notas').value;

    if (cart.length === 0) return;

    var total = 0;
    var detalles = [];
    for (var i = 0; i < cart.length; i++) {
        total += (cart[i].precio * cart[i].cantidad);
        detalles.push(cart[i].cantidad + ' x ' + cart[i].nombre);
    }
    var detallePedido = detalles.join(', ');

    // Validamos que ya tengamos los datos del restaurante cargados en memoria
    if (!window.RESTAURANTE_ACTUAL || !window.RESTAURANTE_ACTUAL.id) {
        alert("⚠️ Error: No se encontró el restaurante en el sistema.");
        return;
    }

    var restauranteData = window.RESTAURANTE_ACTUAL;
    var telefonoNegocio = "";
    var nombreNegocio = restauranteData.nombre_restaurante || "Restaurante";

    var telefonoCrudo = restauranteData.telefono || "";
    
    if (telefonoCrudo) {
        let telLimpio = String(telefonoCrudo).replace(/\D/g, '');
        if (telLimpio.length === 10) {
            telefonoNegocio = "57" + telLimpio;
        } else {
            telefonoNegocio = telLimpio;
        }
    }

    if (!telefonoNegocio) {
        alert("⚠️ Error: El restaurante no tiene un número de WhatsApp configurado.");
        return;
    }

    try {
        // 2. Guarda el pedido en la base de datos usando el ID real
        var resPedido = await supabaseClient.from('pedidos').insert([{
            restaurante_id: restauranteData.id,
            cliente_nombre: 'Anónimo',
            cliente_telefono: 'Sin teléfono',
            direccion: direccion,
            detalle: detallePedido,
            items: detallePedido,
            total: total,
            estado: 'Pendiente',
            metodo_pago: metodoPago,
            notas: notas || ''
        }]);

        if (resPedido.error) {
            console.error("Error de Supabase:", resPedido.error);
            alert("Error al guardar: " + resPedido.error.message);
            return;
        }

        // 3. Arma el mensaje estructurado para WhatsApp
        var mensajeWhatsapp = `*NUEVO PEDIDO - ${nombreNegocio}*\n\n` +
            `• *Dirección:* ${direccion}\n` +
            `• *Pedido:* ${detallePedido}\n` +
            `• *Total:* $ ${total.toLocaleString('es-CO')}\n` +
            `• *Pago:* ${metodoPago}\n` +
            (notas ? `• *Notas:* ${notas}\n` : '') +
            `\n\n[/NUEVO_PEDIDO]`;

        var linkFinal = 'https://wa.me/' + telefonoNegocio + '?text=' + encodeURIComponent(mensajeWhatsapp);

        // 4. Limpia el carrito y abre el WhatsApp correcto
        cart = [];
        if (typeof actualizarBarraCarrito === 'function') actualizarBarraCarrito();
        if (typeof cerrarModalPedido === 'function') cerrarModalPedido();

        window.location.href = linkFinal;
        return;

    } catch (err) {
        console.error("Error inesperado:", err);
        alert("Error inesperado: " + err.message);
    }
}
        window.cargarMenu = cargarMenu;
        window.onload = function() {
            cargarMenu();
        };
