<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital | Velox</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Ocultar barra de scroll en las categorías */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-28 font-sans antialiased">

    <!-- Header Restaurante -->
    <header class="relative bg-slate-900 border-b border-slate-800 p-5 text-center shadow-md">
        <div class="inline-block bg-amber-500/10 text-amber-400 text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-full mb-2 border border-amber-500/20">
            🟢 Abierto • Domicilios
        </div>
        <h1 id="res-nombre" class="text-2xl font-black text-white tracking-wide">Cargando restaurante...</h1>
        <p class="text-xs text-slate-400 mt-1">Tiempo estimado: 30 - 45 min</p>
    </header>

    <!-- Banner promocional / Carta en foto (Opcional si el restaurante ya tiene su imagen) -->
    <div id="banner-container" class="hidden p-4 max-w-md mx-auto">
        <img id="res-banner" src="" alt="Menú Especial" class="w-full h-auto rounded-2xl border border-slate-800 shadow-lg object-cover">
    </div>

    <!-- Barra de Categorías (Sticky) -->
    <nav class="sticky top-0 bg-slate-950/95 backdrop-blur-md border-b border-slate-800 p-3 z-20">
        <div id="categorias-bar" class="flex gap-2 overflow-x-auto no-scrollbar max-w-md mx-auto">
            <button onclick="filtrarCategoria('todas')" class="cat-btn bg-amber-500 text-slate-950 font-bold px-4 py-1.5 rounded-full text-xs whitespace-nowrap shadow">
                Todas
            </button>
        </div>
    </nav>

    <!-- Lista de Productos -->
    <main class="max-w-md mx-auto p-4 space-y-4" id="lista-productos">
        <div class="text-center py-12 text-slate-500 text-sm">Cargando menú delicioso...</div>
    </main>

    <!-- Carrito Flotante (Bottom Bar) -->
    <div id="cart-bar" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-amber-500 text-slate-950 p-4 rounded-2xl flex justify-between items-center shadow-2xl font-bold cursor-pointer transition-all transform active:scale-95 hidden z-30" onclick="abrirModal()">
        <div class="flex items-center gap-2">
            <span id="cart-count" class="bg-slate-950 text-amber-400 px-2.5 py-1 rounded-full text-xs font-black">0</span>
            <span class="text-sm tracking-wide">Ver mi pedido</span>
        </div>
        <span id="cart-total" class="text-lg font-black">$0</span>
    </div>

    <!-- Modal de Checkout / Envío -->
    <div id="checkout-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-end justify-center z-50 hidden p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-white">Confirmar Domicilio</h3>
                <button onclick="cerrarModal()" class="text-slate-400 text-xl font-bold p-1">✕</button>
            </div>

            <!-- Resumen de items -->
            <div id="modal-items" class="space-y-2 text-xs text-slate-300 divide-y divide-slate-800/50 max-h-36 overflow-y-auto pr-1"></div>

            <!-- Formulario -->
            <div class="space-y-3 pt-2">
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Tu Nombre</label>
                    <input type="text" id="cli-nombre" placeholder="Ej: Carlos Pérez" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white mt-1 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Dirección de Entrega</label>
                    <input type="text" id="cli-direccion" placeholder="Ej: Calle 80 #10-20 Apt 301" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white mt-1 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Método de Pago</label>
                    <select id="cli-pago" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white mt-1 focus:outline-none focus:border-amber-500">
                        <option value="Efectivo">💵 Efectivo</option>
                        <option value="Nequi">📱 Nequi / Daviplata</option>
                        <option value="Tarjeta">💳 Tarjeta (Datáfono)</option>
                    </select>
                </div>
            </div>

            <div class="pt-2">
                <button onclick="enviarPedidoWhatsApp()" class="w-full bg-green-500 hover:bg-green-400 text-slate-950 font-black py-3 rounded-xl text-sm flex justify-center items-center gap-2 shadow-lg transition">
                    <span>Enviar Pedido a WhatsApp</span> 🚀
                </button>
            </div>
        </div>
    </div>

    <script>
        // Configura tu Supabase URL y KEY pública aquí
        const SUPABASE_URL = "https://ozailviyimrjmeprilbp.supabase.co"; 
        const SUPABASE_KEY = "TU_SUPABASE_ANON_KEY_AQUI"; 
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let carrito = {};
        let productosGlobal = [];
        let restauranteActual = null;

        // Obtener restaurant_id de la URL ?res=ID_O_PHONE_ID
        const urlParams = new URLSearchParams(window.location.search);
        const resId = urlParams.get('res') || '1221869651012458'; // Fallback a tu Phone Number ID de prueba

        async function cargarMenu() {
            // 1. Obtener datos del Restaurante
            const { data: res } = await supabase.from('restaurantes').select('*').or(`id.eq.${resId},phone_number_id.eq.${resId}`).single();
            if (res) {
                restauranteActual = res;
                document.getElementById('res-nombre').innerText = res.nombre;
            }

            // 2. Obtener Productos
            const { data: prods } = await supabase.from('productos').select('*');
            productosGlobal = prods || [];
            
            renderizarProductos(productosGlobal);
        }

        function renderizarProductos(lista) {
            const cont = document.getElementById('lista-productos');
            if (lista.length === 0) {
                cont.innerHTML = `<div class="text-center py-8 text-slate-500">No hay productos disponibles.</div>`;
                return;
            }

            cont.innerHTML = lista.map(p => `
                <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-3.5 flex gap-3 items-center shadow-md">
                    <img src="${p.imagen_url || 'https://via.placeholder.com/100?text=Velox'}" class="w-20 h-20 rounded-xl object-cover bg-slate-800">
                    <div class="flex-1">
                        <h4 class="font-bold text-sm text-white">${p.nombre}</h4>
                        <p class="text-[11px] text-slate-400 leading-tight mt-0.5 line-clamp-2">${p.descripcion || ''}</p>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-amber-400 font-extrabold text-sm">$${Number(p.precio).toLocaleString('es-CO')}</span>
                            <div class="flex items-center gap-2">
                                <button onclick="modificarCantidad('${p.id}', -1)" class="w-7 h-7 bg-slate-800 text-slate-300 font-bold rounded-lg flex items-center justify-center text-xs border border-slate-700">-</button>
                                <span id="cant-${p.id}" class="text-xs font-bold w-4 text-center">${carrito[p.id]?.cantidad || 0}</span>
                                <button onclick="modificarCantidad('${p.id}', 1)" class="w-7 h-7 bg-amber-500 text-slate-950 font-black rounded-lg flex items-center justify-center text-xs shadow">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function modificarCantidad(id, cambio) {
            const p = productosGlobal.find(x => x.id === id);
            if (!p) return;

            if (!carrito[id]) carrito[id] = { ...p, cantidad: 0 };
            carrito[id].cantidad += cambio;

            if (carrito[id].cantidad <= 0) delete carrito[id];

            document.getElementById(`cant-${id}`).innerText = carrito[id]?.cantidad || 0;
            actualizarBarraCarrito();
        }

        function actualizarBarraCarrito() {
            const bar = document.getElementById('cart-bar');
            const items = Object.values(carrito);
            const totalCant = items.reduce((acc, item) => acc + item.cantidad, 0);
            const totalPrecio = items.reduce((acc, item) => acc + (item.cantidad * item.precio), 0);

            if (totalCant > 0) {
                bar.classList.remove('hidden');
                document.getElementById('cart-count').innerText = totalCant;
                document.getElementById('cart-total').innerText = `$${totalPrecio.toLocaleString('es-CO')}`;
            } else {
                bar.classList.add('hidden');
            }
        }

        function abrirModal() {
            const container = document.getElementById('modal-items');
            container.innerHTML = Object.values(carrito).map(i => `
                <div class="flex justify-between py-1.5">
                    <span>${i.cantidad}x ${i.nombre}</span>
                    <span class="font-bold text-amber-400">$${(i.cantidad * i.precio).toLocaleString('es-CO')}</span>
                </div>
            `).join('');
            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('checkout-modal').classList.add('hidden');
        }

        function enviarPedidoWhatsApp() {
            const nombre = document.getElementById('cli-nombre').value.trim();
            const direccion = document.getElementById('cli-direccion').value.trim();
            const pago = document.getElementById('cli-pago').value;

            if (!nombre || !direccion) {
                alert('Por favor ingresa tu nombre y dirección para el domicilio.');
                return;
            }

            const itemsStr = Object.values(carrito).map(i => `${i.cantidad} ${i.nombre}`).join(', ');
            const total = Object.values(carrito).reduce((acc, i) => acc + (i.cantidad * i.precio), 0);

            // Construcción del mensaje con el formato que lee el Bot de Velox
            const texto = `¡Hola! Quisiera hacer este pedido:\n\n[NUEVO_PEDIDO]\nCliente: ${nombre}\nItems: ${itemsStr}\nTotal: $${total.toLocaleString('es-CO')}\nDirección: ${direccion}\nPago: ${pago}\n[/NUEVO_PEDIDO]`;

            const phone = restauranteActual?.telefono_contacto || '573222027893';
            const url = `https://wa.me/${phone.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(texto)}`;

            window.open(url, '_blank');
        }

        cargarMenu();
    </script>
</body>
</html>
