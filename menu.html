<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital | Velox Premium</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes pulse-subtle { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .animate-pulse-subtle { animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-32 font-sans antialiased selection:bg-amber-500 selection:text-slate-950">

    <!-- Header Elegante -->
    <header class="relative bg-gradient-to-b from-slate-900 via-slate-900 to-slate-950 border-b border-slate-800/80 pt-8 pb-6 px-4 text-center shadow-xl">
        <div class="max-w-md mx-auto space-y-3">
            <div class="inline-flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[11px] font-bold px-3 py-1 rounded-full backdrop-blur-md">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Abierto ahora • Domicilios rápidos</span>
            </div>
            
            <h1 id="res-nombre" class="text-3xl font-black text-white tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                Restaurante Demo Velox
            </h1>
            
            <div class="flex items-center justify-center gap-4 text-xs text-slate-400 font-medium">
                <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5 text-amber-400"></i> 30-45 min</span>
                <span class="text-slate-700">•</span>
                <span class="flex items-center gap-1"><i data-lucide="star" class="w-3.5 h-3.5 text-amber-400 fill-amber-400"></i> 4.9 (120+)</span>
                <span class="text-slate-700">•</span>
                <span class="flex items-center gap-1"><i data-lucide="bike" class="w-3.5 h-3.5 text-amber-400"></i> Domicilio $4.000</span>
            </div>
        </div>
    </header>

    <!-- Barra de Navegación / Categorías (Sticky) -->
    <nav class="sticky top-0 bg-slate-950/90 backdrop-blur-md border-b border-slate-800/80 py-3 px-4 z-20 shadow-md">
        <div id="categorias-bar" class="flex gap-2 overflow-x-auto no-scrollbar max-w-md mx-auto">
            <button onclick="filtrarCategoria('todas')" class="cat-btn bg-amber-500 text-slate-950 font-extrabold px-4 py-2 rounded-xl text-xs whitespace-nowrap shadow-lg shadow-amber-500/20 transition-all">
                🔥 Destacados
            </button>
            <button onclick="filtrarCategoria('hamburguesas')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap hover:border-slate-700 transition-all">
                🍔 Hamburguesas
            </button>
            <button onclick="filtrarCategoria('pizzas')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap hover:border-slate-700 transition-all">
                🍕 Pizzas
            </button>
            <button onclick="filtrarCategoria('bebidas')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap hover:border-slate-700 transition-all">
                🥤 Bebidas
            </button>
        </div>
    </nav>

    <!-- Contenedor Principal del Menú -->
    <main class="max-w-md mx-auto p-4 space-y-4" id="lista-productos">
        <!-- Renderizado de productos aquí -->
    </main>

    <!-- Barra Flotante de Carrito (Bottom Bar) -->
    <div id="cart-bar" class="fixed bottom-6 left-4 right-4 max-w-md mx-auto bg-amber-500 text-slate-950 p-4 rounded-2xl flex justify-between items-center shadow-2xl shadow-amber-500/20 font-black cursor-pointer transition-all transform active:scale-95 hidden z-30 border border-amber-400/50" onclick="abrirModal()">
        <div class="flex items-center gap-3">
            <div class="bg-slate-950 text-amber-400 w-8 h-8 rounded-xl flex items-center justify-center text-xs font-black shadow-inner" id="cart-count">
                0
            </div>
            <div class="flex flex-col">
                <span class="text-xs uppercase tracking-wider text-slate-900/80 font-bold">Ver mi pedido</span>
                <span class="text-sm tracking-tight text-slate-950 font-black">Confirmar Selección</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span id="cart-total" class="text-xl font-black">$0</span>
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </div>
    </div>

    <!-- Modal de Finalizar Pedido -->
    <div id="checkout-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-end sm:items-center justify-center z-50 hidden p-0 sm:p-4 transition-all">
        <div class="bg-slate-900 border border-slate-800/80 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
            
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2">
                    <i data-lucide="shopping-bag" class="w-5 h-5 text-amber-400"></i>
                    <h3 class="text-base font-bold text-white">Tu Pedido</h3>
                </div>
                <button onclick="cerrarModal()" class="text-slate-400 hover:text-white p-1 rounded-lg bg-slate-800/50">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Resumen de items -->
            <div id="modal-items" class="space-y-2 text-xs text-slate-300 divide-y divide-slate-800/50 max-h-40 overflow-y-auto pr-1"></div>

            <!-- Formulario de Envío -->
            <div class="space-y-3 pt-2">
                <div>
                    <label class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest flex items-center gap-1">
                        <i data-lucide="user" class="w-3 h-3 text-amber-400"></i> Nombre Completo
                    </label>
                    <input type="text" id="cli-nombre" placeholder="Ej: Carlos Pérez" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white mt-1 focus:outline-none focus:border-amber-500 transition-colors">
                </div>
                <div>
                    <label class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest flex items-center gap-1">
                        <i data-lucide="map-pin" class="w-3 h-3 text-amber-400"></i> Dirección de Entrega
                    </label>
                    <input type="text" id="cli-direccion" placeholder="Ej: Calle 80 #10-20 Apt 301" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white mt-1 focus:outline-none focus:border-amber-500 transition-colors">
                </div>
                <div>
                    <label class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest flex items-center gap-1">
                        <i data-lucide="credit-card" class="w-3 h-3 text-amber-400"></i> Método de Pago
                    </label>
                    <select id="cli-pago" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white mt-1 focus:outline-none focus:border-amber-500 transition-colors">
                        <option value="Efectivo">💵 Efectivo al entregar</option>
                        <option value="Nequi">📱 Nequi / Daviplata</option>
                        <option value="Tarjeta">💳 Tarjeta (Datáfono)</option>
                    </select>
                </div>
            </div>

            <!-- Botón WhatsApp -->
            <div class="pt-2">
                <button onclick="enviarPedidoWhatsApp()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-sm flex justify-center items-center gap-2 shadow-lg shadow-emerald-500/20 transition-all">
                    <span>Enviar Pedido directo a WhatsApp</span>
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // 1. Plantilla de Demostración
        const PLANTILLA_DEMO = [
            {
                id: '1',
                nombre: 'Hamburguesa Velox Trufada',
                descripcion: '180g de carne de res madurada, queso cheddar doble, tocineta crocante y mayo trufada en pan brioche.',
                precio: 26000,
                categoria: 'hamburguesas',
                imagen_url: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80'
            },
            {
                id: '2',
                nombre: 'Pizza Peperoni Supreme',
                descripcion: 'Salsa pomodoro artesanal, doble queso mozzarella, peperoni premium y toque de orégano fresco.',
                precio: 24000,
                categoria: 'pizzas',
                imagen_url: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=600&q=80'
            },
            {
                id: '3',
                nombre: 'Papas Rústicas Velox',
                descripcion: 'Papas artesanalmente cortadas en cascos con sal marina, romero y salsa bbq de la casa.',
                precio: 9000,
                categoria: 'hamburguesas',
                imagen_url: 'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=600&q=80'
            },
            {
                id: '4',
                nombre: 'Gaseosa Coca-Cola 1.5L',
                descripcion: 'Bebida gaseosa helada para acompañar tu banquete.',
                precio: 8000,
                categoria: 'bebidas',
                imagen_url: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=600&q=80'
            }
        ];

        let carrito = {};
        let productosGlobal = PLANTILLA_DEMO;

        // 2. Función para renderizar los productos en pantalla
        function renderizarProductos(lista) {
            const cont = document.getElementById('lista-productos');
            if (!cont) return;

            if (lista.length === 0) {
                cont.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">No hay productos disponibles.</div>`;
                return;
            }

            cont.innerHTML = lista.map(p => `
                <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-3.5 flex gap-3.5 items-center shadow-lg">
                    <img src="${p.imagen_url}" class="w-20 h-20 rounded-xl object-cover bg-slate-950 flex-shrink-0">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-sm text-white truncate">${p.nombre}</h4>
                        <p class="text-[11px] text-slate-400 leading-snug mt-1 line-clamp-2">${p.descripcion}</p>
                        <div class="flex justify-between items-center mt-3">
                            <span class="text-amber-400 font-black text-sm">$${Number(p.precio).toLocaleString('es-CO')}</span>
                            <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl p-1">
                                <button onclick="modificarCantidad('${p.id}', -1)" class="w-6 h-6 bg-slate-800 text-slate-300 font-bold rounded-lg flex items-center justify-center text-xs">-</button>
                                <span id="cant-${p.id}" class="text-xs font-black w-4 text-center text-white">${carrito[p.id]?.cantidad || 0}</span>
                                <button onclick="modificarCantidad('${p.id}', 1)" class="w-6 h-6 bg-amber-500 text-slate-950 font-black rounded-lg flex items-center justify-center text-xs">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            if (window.lucide) lucide.createIcons();
        }

        function filtrarCategoria(cat) {
            if (cat === 'todas') {
                renderizarProductos(productosGlobal);
            } else {
                const filtrados = productosGlobal.filter(p => p.categoria === cat);
                renderizarProductos(filtrados.length > 0 ? filtrados : productosGlobal);
            }
        }

        function modificarCantidad(id, cambio) {
            const p = productosGlobal.find(x => x.id === id);
            if (!p) return;

            if (!carrito[id]) carrito[id] = { ...p, cantidad: 0 };
            carrito[id].cantidad += cambio;

            if (carrito[id].cantidad <= 0) delete carrito[id];

            const cantElem = document.getElementById(`cant-${id}`);
            if (cantElem) cantElem.innerText = carrito[id]?.cantidad || 0;
            
            actualizarBarraCarrito();
        }

        function actualizarBarraCarrito() {
            const bar = document.getElementById('cart-bar');
            if (!bar) return;

            const items = Object.values(carrito);
            const totalCant = items.reduce((acc, item) => acc + item.cantidad, 0);
            const totalPrecio = items.reduce((acc, item) => acc + (item.cantidad * item.precio), 0);

            if (totalCant > 0) {
                bar.classList.remove('hidden');
                document.getElementById('cart-count').innerText = totalCant;
                document.getElementById('cart-total').innerText = `$${totalPrecio.toLocaleString('es-CO')}`;
            } else {
                bar.classList.add('hidden');
            }
        }

        function abrirModal() {
            const container = document.getElementById('modal-items');
            if (container) {
                container.innerHTML = Object.values(carrito).map(i => `
                    <div class="flex justify-between items-center py-2">
                        <span class="text-slate-200 font-medium">${i.cantidad}x ${i.nombre}</span>
                        <span class="font-bold text-amber-400">$${(i.cantidad * i.precio).toLocaleString('es-CO')}</span>
                    </div>
                `).join('');
            }
            document.getElementById('checkout-modal')?.classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('checkout-modal')?.classList.add('hidden');
        }

        function enviarPedidoWhatsApp() {
            const nombre = document.getElementById('cli-nombre').value.trim();
            const direccion = document.getElementById('cli-direccion').value.trim();
            const pago = document.getElementById('cli-pago').value;

            if (!nombre || !direccion) {
                alert('Por favor completa tu nombre y dirección.');
                return;
            }

            const itemsStr = Object.values(carrito).map(i => `${i.cantidad} ${i.nombre}`).join(', ');
            const total = Object.values(carrito).reduce((acc, i) => acc + (i.cantidad * i.precio), 0);

            const texto = `¡Hola! Quisiera hacer este pedido:\n\n[NUEVO_PEDIDO]\nCliente: ${nombre}\nItems: ${itemsStr}\nTotal: $${total.toLocaleString('es-CO')}\nDirección: ${direccion}\nPago: ${pago}\n[/NUEVO_PEDIDO]`;

            const url = `https://wa.me/573222027893?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }

        // Cargar menú demo al iniciar
        renderizarProductos(PLANTILLA_DEMO);
    </script>
