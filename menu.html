<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital | Velox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24">

    <!-- HEADER -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-40">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div>
                <h1 id="nombre-restaurante" class="text-xl font-bold text-white">Menú Digital</h1>
                <p class="text-xs text-emerald-400 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Pedidos directos a cocina
                </p>
            </div>
        </div>
    </header>

    <!-- CATÁLOGO -->
    <main class="max-w-md mx-auto p-4 space-y-4" id="contenedor-menu">
        <p class="text-center text-slate-400 py-10" id="estado-carga">Cargando catálogo...</p>
    </main>

    <!-- BARRA CARRITO -->
    <div id="barra-carrito" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto hidden z-40">
        <button onclick="abrirModalPedido()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 px-5 rounded-2xl shadow-xl flex items-center justify-between">
            <span class="bg-slate-950/20 px-3 py-1 rounded-lg text-sm" id="cant-items">0 ítems</span>
            <span>Ver Pedido 🚀</span>
            <span id="total-carrito">$0</span>
        </button>
    </div>

    <!-- MODAL -->
    <div id="modal-pedido" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl text-slate-100">
            <div class="flex justify-between items-center mb-5 border-b border-slate-800 pb-3">
                <h3 class="text-xl font-bold text-white">Finalizar Pedido</h3>
                <button onclick="cerrarModalPedido()" class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>

            <form id="form-confirmar-pedido" onsubmit="confirmarYEnviarPedido(event)" class="space-y-4">
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Dirección de Entrega *</label>
                    <input type="text" id="input-direccion" required placeholder="Ej: Calle 45 # 10-20" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Método de Pago *</label>
                    <select id="select-pago" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm">
                        <option value="Efectivo">Efectivo contra entrega</option>
                        <option value="Transferencia (Nequi / Daviplata)">Transferencia (Nequi / Daviplata)</option>
                        <option value="Datáfono">Datáfono al entregar</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Notas especiales</label>
                    <textarea id="input-notas" rows="2" placeholder="Ej: Sin cebolla..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm resize-none"></textarea>
                </div>
                <div class="pt-3 flex gap-3">
                    <button type="button" onclick="cerrarModalPedido()" class="w-1/3 bg-slate-800 text-slate-300 py-3 rounded-xl text-sm">Cancelar</button>
                    <button type="submit" class="w-2/3 bg-emerald-500 text-slate-950 font-bold py-3 rounded-xl text-sm">Confirmar Pedido 🚀</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        var SUPABASE_URL = 'https://ozailviyimrjmebrilbp.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_6YqFb_vPKTOFJZ9sp8AUzw_4aNLkH-l';
        var supabaseClient = null;
        var cart = [];
        var numeroWhatsAppRestaurante = '';
        var ID_RESTAURANTE_ACTUAL = null;

        if (window.supabase && window.supabase.createClient) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

       async function cargarMenu() {
    var contenedor = document.getElementById('contenedor-menu');
    var urlParams = new URLSearchParams(window.location.search);
    var clienteSlug = urlParams.get('slug') || urlParams.get('r');

    if (!clienteSlug) {
        contenedor.innerHTML = '<p class="text-center text-red-400 py-10">Error: No se especificó el restaurante.</p>';
        return;
    }

    if (!supabaseClient && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    let { data: restData, error: restError } = await supabaseClient
        .from('restaurantes')
        .select('*')
        .eq('slug', clienteSlug)
        .maybeSingle();

    if (restError || !restData) {
        contenedor.innerHTML = '<p class="text-center text-red-400 py-10">Restaurante no encontrado.</p>';
        return;
    }

    ID_RESTAURANTE_ACTUAL = restData.id;
    var elNombre = document.getElementById('nombre-restaurante');
    if (elNombre) elNombre.innerText = restData.nombre_restaurante;

    let { data: productos, error: resProd } = await supabaseClient
        .from('productos')
        .select('*')
        .eq('restaurante_id', ID_RESTAURANTE_ACTUAL);

    if (resProd || !productos) {
        contenedor.innerHTML = '<p class="text-center text-red-400 py-6">No se pudieron cargar los productos.</p>';
        return;
    }

    const productosPorCategoria = {};
    productos.forEach(prod => {
        const cat = prod.categoria || 'General';
        if (!productosPorCategoria[cat]) {
            productosPorCategoria[cat] = [];
        }
        productosPorCategoria[cat].push(prod);
    });

    var html = '';
    for (const [categoria, lista] of Object.entries(productosPorCategoria)) {
        html += `
            <div class="mb-8">
                <h2 class="text-xl font-bold text-amber-400 border-b border-slate-700 pb-2 mb-4 uppercase tracking-wide flex items-center gap-2">
                    <span>📌</span> ${categoria}
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        `;

        lista.forEach(prod => {
            const precioValido = Number(prod.precio) || 0;
            const nombreSeguro = prod.nombre ? prod.nombre.replace(/'/g, "\\'") : '';

            html += `
                <div class="bg-slate-800 p-4 rounded-2xl flex flex-col justify-between border border-slate-700/60 shadow-md">
                    <div class="flex items-start space-x-3">
                        ${prod.imagen_url ? `<img src="${prod.imagen_url}" class="w-20 h-20 md:w-24 md:h-24 object-cover rounded-xl border border-slate-700 flex-shrink-0">` : ''}
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-white text-sm md:text-base leading-snug">${prod.nombre}</h3>
                            <p class="text-xs text-slate-400 line-clamp-2 mt-1 leading-relaxed">${prod.descripcion || ''}</p>
                            <p class="text-emerald-400 font-extrabold text-sm md:text-base mt-2">$${precioValido.toLocaleString('es-CO')}</p>
                        </div>
                    </div>
                    <div class="mt-3 pt-3 border-t border-slate-700/40 flex justify-end">
                        <button onclick="agregarAlCarrito('${prod.id}', '${nombreSeguro}', ${precioValido})" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-slate-950 font-bold text-xs py-2 px-4 rounded-xl transition-all flex items-center gap-1 shadow">
                            <span>+</span> Agregar
                        </button>
                    </div>
                </div>
            `;
        });

        html += `
                </div>
            </div>
        `;
    }

    contenedor.innerHTML = html;
}
            
        

        function agregarAlCarrito(id, nombre, precio) {
            var item = cart.find(function(i) { return i.id === id; });
            if (item) {
                item.cantidad++;
            } else {
                cart.push({ id: id, nombre: nombre, precio: precio, cantidad: 1 });
            }
            actualizarBarraCarrito();
        }

        function actualizarBarraCarrito() {
            var barra = document.getElementById('barra-carrito');
            var cantItems = document.getElementById('cant-items');
            var totalCarrito = document.getElementById('total-carrito');

            var totalCantidad = 0;
            var totalPrecio = 0;
            for (var i = 0; i < cart.length; i++) {
                totalCantidad += cart[i].cantidad;
                totalPrecio += (cart[i].precio * cart[i].cantidad);
            }

            if (totalCantidad > 0) {
                barra.classList.remove('hidden');
                cantItems.innerText = totalCantidad + (totalCantidad === 1 ? ' ítem' : ' ítems');
                totalCarrito.innerText = '$' + totalPrecio.toLocaleString('es-CO');
            } else {
                barra.classList.add('hidden');
            }
        }

        function abrirModalPedido() {
            if (cart.length === 0) return;
            var modal = document.getElementById('modal-pedido');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function cerrarModalPedido() {
            var modal = document.getElementById('modal-pedido');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

     async function confirmarYEnviarPedido(event) {
    event.preventDefault();
    
    var direccion = document.getElementById('input-direccion').value;
    var metodoPago = document.getElementById('select-pago').value;
    var notas = document.getElementById('input-notas').value;

    if (cart.length === 0) return;

    var total = 0;
    var detalles = [];
    for (var i = 0; i < cart.length; i++) {
        total += (cart[i].precio * cart[i].cantidad);
        detalles.push(cart[i].cantidad + 'x ' + cart[i].nombre);
    }
    var detallePedido = detalles.join(', ');

    try {
        // 1. Lee automáticamente el parámetro de la URL (sirve para cualquier restaurante sin importar su nombre o ID)
        var urlParams = new URLSearchParams(window.location.search);
        var identificadorRestaurante = urlParams.get('slug') || urlParams.get('r');

        if (!identificadorRestaurante) {
            alert("⚠️ Error: El enlace del menú no es válido.");
            return;
        }

        // 2. Busca universalmente al restaurante en la base de datos por su slug o por su ID
        let { data: restaurante, error: errorRest } = await supabaseClient
            .from('restaurantes')
            .select('*')
            .or(`slug.eq.${identificadorRestaurante},id.eq.${identificadorRestaurante}`)
            .maybeSingle();

        if (errorRest || !restaurante) {
            alert("⚠️ Error: No se encontró el restaurante en el sistema.");
            return;
        }

        // 3. Guarda el pedido usando el ID exacto del restaurante encontrado
        var res = await supabaseClient.from('pedidos').insert([{
            restaurant_id: restaurante.id,
            cliente_nombre: 'Anónimo',
            cliente_telefono: 'Sin teléfono',
            direccion: direccion,
            detalle: detallePedido,
            items: detallePedido,
            total: total,
            estado: 'Pendiente',
            metodo_pago: metodoPago,
            notas: notas || ''
        }]);

        if (res.error) throw res.error;

        // 4. Valida de forma universal si el restaurante tiene teléfono registrado
        if (!restaurante.telefono) {
            alert("⚠️ Pedido guardado con éxito, pero este establecimiento no tiene un número de WhatsApp configurado.");
            return;
        }

        let numeroLimpio = String(restaurante.telefono).replace(/[^0-9]/g, '');
        let nombreNegocio = restaurante.nombre_restaurante || "Restaurante";

        // 5. Arma el mensaje estructurado para WhatsApp
        var mensajeWhatsApp = `*NUEVO PEDIDO - ${nombreNegocio}*\n\n` +
            "- *Dirección:* " + direccion + "\n" +
            "- *Pedido:* " + detallePedido + "\n" +
            "- *Total:* $" + total.toLocaleString('es-CO') + "\n" +
            "- *Pago:* " + metodoPago +
            (notas ? "\n- *Notas:* " + notas : "") +
            "\n\n[/NUEVO_PEDIDO]";

        let prefijo = numeroLimpio.startsWith('57') ? '' : '57';
        var linkFinal = 'https://wa.me/' + prefijo + numeroLimpio + '?text=' + encodeURIComponent(mensajeWhatsApp);
        
        // 6. Limpia el carrito y redirige automáticamente al WhatsApp del negocio
        cart = [];
        if (typeof actualizarBarraCarrito === 'function') actualizarBarraCarrito();

        window.location.href = linkFinal;
        return;

    } catch (err) {
        alert("⚠️ Error inesperado: " + err.message);
        console.error(err);
    }
}
        window.cargarMenu = cargarMenu;
        window.onload = function() {
            cargarMenu();
        };
    </script>
</body>
</html>
