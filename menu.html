<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital | Velox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24">

    <!-- HEADER -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-40">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div>
                <h1 id="nombre-restaurante" class="text-xl font-bold text-white">Menú Digital</h1>
                <p class="text-xs text-emerald-400 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Pedidos directos a cocina
                </p>
            </div>
        </div>
    </header>

    <!-- CATÁLOGO DE PRODUCTOS -->
    <main class="max-w-md mx-auto p-4 space-y-4" id="contenedor-menu">
        <p class="text-center text-slate-400 py-10" id="estado-carga">Cargando catálogo...</p>
    </main>

    <!-- BARRA FLOTANTE DEL CARRITO -->
    <div id="barra-carrito" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto hidden z-40">
        <button onclick="abrirModalPedido()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 px-5 rounded-2xl shadow-xl flex items-center justify-between">
            <span class="bg-slate-950/20 px-3 py-1 rounded-lg text-sm" id="cant-items">0 ítems</span>
            <span>Ver Pedido 🚀</span>
            <span id="total-carrito">$0</span>
        </button>
    </div>

    <!-- MODAL DE CONFIRMACIÓN DE PEDIDO -->
    <div id="modal-pedido" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl text-slate-100">
            <div class="flex justify-between items-center mb-5 border-b border-slate-800 pb-3">
                <h3 class="text-xl font-bold text-white">Finalizar Pedido</h3>
                <button onclick="cerrarModalPedido()" class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>

            <form id="form-confirmar-pedido" onsubmit="confirmarYEnviarPedido(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Dirección de Entrega *</label>
                    <input type="text" id="input-direccion" required placeholder="Ej: Calle 45 # 10-20, Apt 301"
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Método de Pago *</label>
                    <select id="select-pago" required
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                        <option value="Efectivo">Efectivo contra entrega</option>
                        <option value="Transferencia (Nequi / Daviplata)">Transferencia (Nequi / Daviplata)</option>
                        <option value="Datáfono">Datáfono al entregar</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Notas especiales (Opcional)</label>
                    <textarea id="input-notas" rows="2" placeholder="Ej: Sin cebolla, timbrar en el 201..."
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm resize-none"></textarea>
                </div>

                <div class="pt-3 flex gap-3">
                    <button type="button" onclick="cerrarModalPedido()" 
                        class="w-1/3 bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 rounded-xl font-medium transition text-sm">
                        Cancelar
                    </button>
                    <button type="submit" 
                        class="w-2/3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg text-sm flex items-center justify-center gap-2">
                        <span>Enviar a WhatsApp</span> 🚀
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ozailviyimrjmebrilbp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_6YqFb_vPKTOFJZ9sp8AUzw_4aNLkH-l'; 
        let supabaseApp;
        try {
            if (window.supabase && window.supabase.createClient) {
                supabaseApp = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (e) {
            console.error('Error inicializando Supabase:', e);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const clienteSlug = urlParams.get('r') || 'demo';
        let numeroWhatsAppRestaurante = ''; // Se llenará desde Supabase
        let cart = [];

       async function cargarMenu() {
    const contenedor = document.getElementById('contenedor-menu');
    
    if (!supabaseApp) {
        contenedor.innerHTML = '<p class="text-center text-slate-400 py-10">Conectando...</p>';
        return;
    }

    try {
        // 1. Traer el teléfono del restaurante desde Supabase usando el slug
        const { data: restData } = await supabaseApp
    .from('restaurantes')
    .select('id, phone_number_id')
    .eq('slug', clienteSlug)
    .single();

        if (restData && restData.phone_number_id) {
            numeroWhatsAppRestaurante = restData.phone_number_id;
        }

        const restaurantId = restData ? restData.id : 1;

        // 2. Traer productos filtrados
        const { data: productos, error } = await supabaseApp
            .from('productos')
            .select('*')
            .eq('restaurante_id', restaurantId);

        if (error) {
            console.error('Error cargando productos:', error);
            contenedor.innerHTML = '<p class="text-center text-red-400 py-10">Error en la base de datos.</p>';
            return;
        }
        
        if (!productos || productos.length === 0) {
            contenedor.innerHTML = '<p class="text-center text-slate-400 py-10">No hay productos disponibles por ahora.</p>';
            return;
        }

        contenedor.innerHTML = productos.map(prod => `
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 flex gap-4 items-center">
                <img src="${prod.imagen_url || 'https://via.placeholder.com/100'}" class="w-20 h-20 object-cover rounded-xl bg-slate-700">
                <div class="flex-1">
                    <h3 class="font-bold text-white">${prod.nombre}</h3>
                    <p class="text-xs text-slate-400">${prod.descripcion || ''}</p>
                    <div class="mt-2 flex justify-between items-center">
                        <span class="font-bold text-emerald-400">$${Number(prod.precio).toLocaleString('es-CO')}</span>
                        <button onclick="agregarAlCarrito('${prod.id}', '${prod.nombre}', ${prod.precio})" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-3 py-1 rounded-lg text-sm">
                            + Agregar
                        </button>
                    </div>
                </div>
            </div>
        `).join('');

    } catch (err) {
        console.error('Error al cargar:', err);
    }
}
        function agregarAlCarrito(id, nombre, precio) {
            const itemExistente = cart.find(i => i.id === id);
            if (itemExistente) {
                itemExistente.cantidad++;
            } else {
                cart.push({ id, nombre, precio, cantidad: 1 });
            }
            actualizarBarraCarrito();
        }

        function actualizarBarraCarrito() {
            const barra = document.getElementById('barra-carrito');
            const cantItems = document.getElementById('cant-items');
            const totalCarrito = document.getElementById('total-carrito');

            const totalCantidad = cart.reduce((acc, item) => acc + item.cantidad, 0);
            const totalPrecio = cart.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);

            if (totalCantidad > 0) {
                barra.classList.remove('hidden');
                cantItems.innerText = totalCantidad + (totalCantidad === 1 ? ' ítem' : ' ítems');
                totalCarrito.innerText = '$' + totalPrecio.toLocaleString('es-CO');
            } else {
                barra.classList.add('hidden');
            }
        }

        function abrirModalPedido() {
            if (cart.length === 0) return;
            const modal = document.getElementById('modal-pedido');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function cerrarModalPedido() {
            const modal = document.getElementById('modal-pedido');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function confirmarYEnviarPedido(event) {
    event.preventDefault();

    const direccion = document.getElementById('direccion').value;
    const metodoPago = document.getElementById('metodoPago').value;
    const notas = document.getElementById('notas').value;

    if (cart.length === 0) return;

    // Calcular total
    const total = cart.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

    try {
        // 1. Guardar DIRECTO en Supabase
        const { data, error } = await supabase
            .from('pedidos')
            .insert([{
                cliente: document.getElementById('nombreCliente')?.value || 'Cliente Web',
                telefono: document.getElementById('telefonoCliente')?.value || 'Sin teléfono',
                direccion: direccion,
                detalle: cart.map(i => `${i.cantidad}x ${i.nombre}`).join(', '),
                total: total,
                estado: 'Pendiente',
                metodo_pago: metodoPago,
                notas: notas
            }]);

        if (error) throw error;

        // 2. Armar mensaje y redirigir a WhatsApp
        const urlWhatsApp = "https://wa.me/" + numeroWhatsAppRestaurante + "?text=" + encodeURIComponent(mensajeWA);
        
        cerrarModalPedido();
        window.open(urlWhatsApp, '_blank');

    } catch (err) {
        console.error('Error insertando pedido:', err);
        alert("⚠️ Error al guardar en la base de datos: " + err.message);
    }
}
