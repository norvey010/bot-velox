<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Menú Digital | Velox</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://ozailviyimrjmebrilbp.supabase.co" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    /* Mantiene ocultos los elementos plegados aunque Tailwind tarde en arrancar. */
    #modal-personalizar.hidden, #modal-pedido.hidden, #barra-carrito.hidden { display: none !important; }
    body.pb-28 { padding-bottom: calc(7rem + env(safe-area-inset-bottom, 0px)); }
    #barra-carrito {
        position: fixed !important;
        top: auto !important;
        left: max(12px, env(safe-area-inset-left, 0px)) !important;
        right: max(12px, env(safe-area-inset-right, 0px)) !important;
        bottom: calc(14px + env(safe-area-inset-bottom, 0px)) !important;
        width: auto;
        max-width: 42rem;
        margin-left: auto;
        margin-right: auto;
        z-index: 40;
        box-sizing: border-box;
        padding: 6px;
        border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 22px;
        background: rgba(13, 14, 16, .88);
        box-shadow: 0 14px 40px rgba(0, 0, 0, .42);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        -webkit-transform: translate3d(0, 0, 0);
        transform: translate3d(0, 0, 0);
        will-change: transform;
    }
    #nombre-restaurante:empty { display: none; }
    /* Ocultar barra de desplazamiento en la barra de categorías */
    .scrollbar-none::-webkit-scrollbar {
        display: none;
    }
    .scrollbar-none {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    .velox-option-list {
        scrollbar-width: thin;
        scrollbar-color: rgba(248, 113, 113, .55) rgba(15, 23, 42, .7);
    }
    .velox-option-list::-webkit-scrollbar { width: 6px; }
    .velox-option-list::-webkit-scrollbar-track { background: rgba(15, 23, 42, .7); border-radius: 999px; }
    .velox-option-list::-webkit-scrollbar-thumb { background: rgba(248, 113, 113, .55); border-radius: 999px; }
    .velox-option:has(input:checked) {
        border-color: rgba(248, 113, 113, .85);
        background: linear-gradient(115deg, rgba(127, 29, 29, .46), rgba(30, 30, 34, .96));
        box-shadow: inset 0 0 0 1px rgba(248, 113, 113, .14), 0 8px 22px rgba(127, 29, 29, .12);
    }
    .velox-option:has(input:checked) .velox-option-title { color: #fbbf24; }
    @keyframes menuCategoryFromRight {
        from { opacity: 0; transform: translate3d(34px, 0, 0) scale(.985); filter: blur(3px); }
        to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); filter: blur(0); }
    }
    @keyframes menuCategoryFromLeft {
        from { opacity: 0; transform: translate3d(-34px, 0, 0) scale(.985); filter: blur(3px); }
        to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); filter: blur(0); }
    }
    .menu-category-enter-next { animation: menuCategoryFromRight .34s cubic-bezier(.2,.75,.25,1) both; }
    .menu-category-enter-previous { animation: menuCategoryFromLeft .34s cubic-bezier(.2,.75,.25,1) both; }
    .menu-product-reveal {
        opacity: 0;
        transform: translateY(9px);
        transition: opacity .28s ease-out, transform .28s ease-out;
    }
    .menu-product-reveal.is-visible { opacity: 1; transform: translateY(0); }
    @media (prefers-reduced-motion: reduce) {
        .menu-category-enter-next, .menu-category-enter-previous { animation-duration: .01ms; }
        .menu-product-reveal { opacity: 1; transform: none; transition: none; }
    }
</style>
</head>

<body class="bg-[#08090b] text-slate-100 min-h-screen pb-28">

    <!-- HEADER -->
    <header class="bg-[#0d0e10]/95 border-b border-red-950/80 p-4 sticky top-0 z-40 shadow-[0_8px_30px_rgba(0,0,0,.28)] backdrop-blur-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div>
                <h1 id="nombre-restaurante" class="text-xl font-bold text-white" aria-live="polite"></h1>
                <p class="text-xs text-amber-400 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                    Pedidos directos a cocina
                </p>
            </div>
        </div>
        <!-- Las categorías permanecen visibles porque forman parte del encabezado fijo. -->
        <div class="max-w-7xl mx-auto pt-3">
            <div id="contenedor-categorias" class="flex gap-2 overflow-x-auto whitespace-nowrap pb-1 scrollbar-none touch-pan-x">
            </div>
        </div>
    </header>
    <!-- CATÁLOGO -->
    <main class="max-w-7xl mx-auto p-4 md:px-6 space-y-4" id="contenedor-menu">
        <div id="estado-carga" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" aria-label="Cargando menú" role="status">
            <span class="sr-only">Cargando menú...</span>
            <div class="h-28 rounded-2xl border border-slate-800 bg-[#111214] animate-pulse"></div>
            <div class="h-28 rounded-2xl border border-slate-800 bg-[#111214] animate-pulse hidden sm:block"></div>
            <div class="h-28 rounded-2xl border border-slate-800 bg-[#111214] animate-pulse hidden lg:block"></div>
        </div>
    </main>

    <!-- BARRA CARRITO -->
    <div id="barra-carrito" class="fixed bottom-4 left-4 right-4 max-w-2xl mx-auto hidden z-40">
        <button onclick="abrirModalPedido()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-5 rounded-2xl shadow-xl shadow-red-950/30 flex items-center justify-between">
            <span class="bg-black/20 px-3 py-1 rounded-lg text-sm" id="cant-items">0 ítems</span>
            <span>Ver Pedido 🚀</span>
            <span id="total-carrito">$0</span>
        </button>
    </div>

   <!-- MODAL DE PERSONALIZACIÓN DE PRODUCTO -->
<div id="modal-personalizar" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4 z-[60]" role="dialog" aria-modal="true" aria-labelledby="titulo-personalizar">
    <form id="form-personalizar" onsubmit="confirmarPersonalizacion(event)" class="relative bg-[#101114] border border-red-900/50 rounded-3xl max-w-md w-full p-5 sm:p-6 shadow-[0_24px_80px_rgba(0,0,0,.65)] text-slate-100 max-h-[90vh] overflow-y-auto">
        <div class="absolute inset-x-8 top-0 h-px bg-gradient-to-r from-transparent via-red-500/80 to-transparent"></div>
        <div class="flex justify-between items-start gap-4 mb-5 border-b border-white/10 pb-4">
            <div><p class="inline-flex items-center gap-2 text-[11px] uppercase tracking-[.18em] text-amber-400 font-extrabold"><span class="h-1.5 w-1.5 rounded-full bg-red-500 shadow-[0_0_10px_rgba(239,68,68,.9)]"></span>Personaliza tu pedido</p><h3 id="titulo-personalizar" class="text-xl font-extrabold text-white mt-2">Elige cómo lo quieres</h3><p id="nombre-personalizar" class="text-sm text-slate-400 mt-1"></p></div>
            <button type="button" onclick="cerrarModalPersonalizar()" aria-label="Cerrar" class="h-9 w-9 shrink-0 rounded-full border border-white/10 bg-white/5 text-slate-400 hover:border-red-400/50 hover:bg-red-500/10 hover:text-white text-2xl leading-none transition">&times;</button>
        </div>
        <div id="campos-personalizar" class="space-y-4"></div>
        <div class="mt-6 flex gap-3">
            <button type="button" onclick="cerrarModalPersonalizar()" class="w-1/3 bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 rounded-xl text-sm font-semibold">Cancelar</button>
            <button type="submit" class="w-2/3 bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl text-sm">Agregar al pedido</button>

    </form>
</div>

   <!-- MODAL DE CONFIRMACIÓN DEL PEDIDO -->
<div id="modal-pedido" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-[#111214] border border-red-950/70 rounded-2xl max-w-md w-full p-6 shadow-2xl text-slate-100">
        <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
            <h3 class="text-xl font-bold text-white">Finalizar Pedido 🛒</h3>
            <button onclick="cerrarModalPedido()" class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
        </div>

        <!-- 1. LISTA DE PRODUCTOS DEL CARRITO (¡Esto es lo que faltaba agregar!) -->
        <div class="mb-4">
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Tus productos:</h4>
            <div id="lista-items-carrito" class="max-h-40 overflow-y-auto space-y-2 pr-1">
                <!-- Aquí se pintan los platos dinámicamente con JS -->
            </div>
            <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-800 font-bold">
                <span class="text-sm text-slate-300">Total a Pagar:</span>
            <span id="total-modal-carrito" class="text-amber-400 text-base">$0</span>
            </div>
        </div>

        <!-- 2. FORMULARIO DE DATOS DE ENVÍO -->
        <form id="form-confirmar-pedido" onsubmit="confirmarYEnviarPedido(event)" class="space-y-3">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Dirección de Entrega *</label>
                <input type="text" id="input-direccion" required placeholder="Ej: Calle 45 # 10-20" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Método de Pago *</label>
                <select id="select-pago" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm">
                    <option value="Efectivo">Efectivo contra entrega</option>
                    <option value="Transferencia (Nequi / Daviplata)">Transferencia (Nequi / Daviplata)</option>
                    <option value="Datáfono">Datáfono al entregar</option>

            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Notas especiales</label>
                <textarea id="input-notas" rows="2" placeholder="Ej: Sin cebolla..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm resize-none"></textarea>
            </div>
            <div class="pt-2 flex gap-3">
                <button type="button" onclick="cerrarModalPedido()" class="w-1/3 bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 rounded-xl text-sm transition">Cancelar</button>

            </div>
        </form>
    </div>
</div>

    <script>
        var SUPABASE_URL = 'https://ozailviyimrjmebrilbp.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_6YqFb_vPKTOFJZ9sp8AUzw_4aNLkH-l';
        var supabaseClient = null;
        var cart = [];
        var numeroWhatsAppRestaurante = '';
        var ID_RESTAURANTE_ACTUAL = null;

        if (window.supabase && window.supabase.createClient) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

       let todosLosProductos = [];
       let categoriasMenu = [];
       let indiceCategoriaActiva = -1;
       let inicioGestoMenu = null;
       let direccionAnimacionMenu = 'next';
       let observadorTarjetasMenu = null;

async function cargarMenu() {
    var contenedor = document.getElementById('contenedor-menu');
    var contenedorCategorias = document.getElementById('contenedor-categorias');
    var urlParams = new URLSearchParams(window.location.search);
    var clienteSlug = urlParams.get('slug') || urlParams.get('r');

    if (!clienteSlug) {
        contenedor.innerHTML = '<p class="text-center text-red-400 py-10">Error: No se especificó el restaurante.</p>';
        return;
    }

    if (!supabaseClient && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    let { data: restData, error: restError } = await supabaseClient
        .from('restaurantes')
        .select('*')
        .eq('slug', clienteSlug)
        .maybeSingle();

    if (restError || !restData) {
        contenedor.innerHTML = '<p class="text-center text-red-400 py-10">Restaurante no encontrado.</p>';
        return;
    }

    ID_RESTAURANTE_ACTUAL = restData.id;
    window.RESTAURANTE_ACTUAL = restData;
    var elNombre = document.getElementById('nombre-restaurante');
    if (elNombre) elNombre.innerText = restData.nombre_restaurante;

    // Forzamos la consulta de productos ordenada por ID para evitar datos cacheados
    let { data: productos, error: resProd } = await supabaseClient
        .from('productos')
        .select('id,nombre,descripcion,precio,categoria,imagen_url,opciones')
        .eq('restaurante_id', ID_RESTAURANTE_ACTUAL)
        .order('id', { ascending: true });

    if (resProd || !productos) {
        contenedor.innerHTML = '<p class="text-center text-red-400 py-6">No se pudieron cargar los productos.</p>';
        return;
    }

    todosLosProductos = productos.map(producto => ({
        ...producto,
        _categoriaOriginal: producto.categoria,
        categoria: resolverCategoriaCombo(producto)
    }));

    // Extraer categorías únicas para los botones superiores
    const categoriasSet = new Set();
    todosLosProductos.forEach(p => categoriasSet.add(p.categoria || 'General'));
    categoriasMenu = Array.from(categoriasSet);
    indiceCategoriaActiva = -1;
    
    let botonesHtml = '';
    categoriasMenu.forEach(cat => {
        botonesHtml += `<button type="button" data-categoria="${escaparHtml(cat)}" class="shrink-0 px-3.5 py-2 sm:px-5 sm:py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-[#141518] border border-slate-800 text-slate-200 hover:border-red-500 hover:text-white transition shadow whitespace-nowrap">${escaparHtml(cat)}</button>`;
    });
    if (contenedorCategorias) contenedorCategorias.innerHTML = botonesHtml;

    if (categoriasMenu.length) filtrarCategoria(categoriasMenu[0]);
    else renderizarProductos(todosLosProductos);
}

function esNombreTamanoPizza(nombre) {
    const normalizado = normalizarTexto(nombre).replace(/\s+/g, ' ').trim();
    return /^(?:pizza\s+)?(?:porci(?:on|ones)|personal(?:\s+\d+)?|individual|mini|pequena|chica|mediana|grande|familiar(?:\s+\d+)?|jumbo|gigante)(?:\s*\(?\s*\d+(?:[.,]\d+)?\s*(?:cm|pulgadas?)\s*\)?)?$/.test(normalizado)
        || /^pizza\s+(?:de\s+)?\d+(?:[.,]\d+)?\s*(?:cm|pulgadas?)$/.test(normalizado);
}

function obtenerVisualProducto(producto, imagenCompartida = '') {
    const url = (imagenCompartida || producto.imagen_url || '').trim();
    const esImagenGenericaAnterior = url.includes('photo-1504674900247-0877df9cc836');
    if (url.startsWith('http') && !esImagenGenericaAnterior) {
        return `<img src="${escaparHtml(url)}" alt="${escaparHtml(producto.nombre)}" loading="lazy" decoding="async" class="w-full h-full object-cover transition duration-500 group-hover:scale-105">`;
    }

    const texto = `${producto.categoria || ''} ${producto.nombre || ''}`
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const visuales = [
        { claves: ['hamburg', 'burger'], iconos: ['🍔', '🍟', '🥪'], fondo: 'from-red-950 via-orange-950 to-[#111214]' },
        { claves: ['arepa'], iconos: ['🫓', '🧀', '🌽'], fondo: 'from-amber-950 via-yellow-950 to-[#111214]' },
        { claves: ['pizza'], iconos: ['🍕', '🧀', '🍅'], fondo: 'from-red-950 via-rose-950 to-[#111214]' },
        { claves: ['bebida', 'jugo', 'gaseosa', 'limonada', 'coctel'], iconos: ['🥤', '🧃', '🍹'], fondo: 'from-cyan-950 via-blue-950 to-[#111214]' },
        { claves: ['pollo', 'broaster', 'alita'], iconos: ['🍗', '🍟', '🍗'], fondo: 'from-orange-950 via-amber-950 to-[#111214]' },
        { claves: ['perro', 'salchipapa', 'salchicha'], iconos: ['🌭', '🍟', '🌭'], fondo: 'from-yellow-950 via-orange-950 to-[#111214]' },
        { claves: ['postre', 'torta', 'helado', 'dulce'], iconos: ['🍰', '🍨', '🧁'], fondo: 'from-fuchsia-950 via-rose-950 to-[#111214]' },
        { claves: ['ensalada', 'vegetar', 'vegano'], iconos: ['🥗', '🥑', '🥬'], fondo: 'from-green-950 via-emerald-950 to-[#111214]' },
        { claves: ['pasta', 'lasana', 'lasagna'], iconos: ['🍝', '🧀', '🍅'], fondo: 'from-orange-950 via-red-950 to-[#111214]' },
        { claves: ['carne', 'parrilla', 'asado', 'chuzo'], iconos: ['🥩', '🍖', '🔥'], fondo: 'from-red-950 via-stone-900 to-[#111214]' }
    ];
    const visual = visuales.find(item => item.claves.some(clave => texto.includes(clave))) || {
        iconos: ['🍽️', '✨', '🥘'], fondo: 'from-amber-950 via-stone-900 to-[#111214]'
    };

    // Selección estable por producto: el mismo plato conserva su visual al recargar.
    const llave = String(producto.id || producto.nombre || 'menu');
    const hash = Array.from(llave).reduce((total, letra) => total + letra.charCodeAt(0), 0);
    const icono = esNombreTamanoPizza(producto.nombre) && texto.includes('pizza')
        ? '🍕'
        : visual.iconos[hash % visual.iconos.length];
    return `<div role="img" aria-label="Ilustración para ${escaparHtml(producto.categoria || 'menú')}" class="relative w-full h-full flex items-center justify-center overflow-hidden bg-gradient-to-br ${visual.fondo}">
        <div class="absolute -right-8 -top-12 w-44 h-44 rounded-full border border-white/5"></div>
        <div class="absolute -left-10 -bottom-16 w-52 h-52 rounded-full border border-white/5"></div>
        <div class="absolute inset-0 opacity-[0.08]" style="background-image:radial-gradient(#fff 1px,transparent 1px);background-size:18px 18px"></div>
        <span class="relative drop-shadow-2xl text-7xl sm:text-8xl select-none">${icono}</span>
        <span class="absolute bottom-3 left-4 text-[10px] uppercase tracking-[.22em] font-bold text-white/45">${escaparHtml(producto.categoria || 'Especialidad')}</span>
    </div>`;
}

function renderizarProductos(listaProds) {
    var contenedor = document.getElementById('contenedor-menu');
    if (observadorTarjetasMenu) {
        observadorTarjetasMenu.disconnect();
        observadorTarjetasMenu = null;
    }
    
    if (!listaProds || listaProds.length === 0) {
        contenedor.innerHTML = `<p class="text-center text-slate-400 p-6">No hay productos disponibles.</p>`;
        return;
    }

    const productosPorCategoria = {};
    listaProds.forEach(prod => {
        const cat = resolverCategoriaCombo(prod);
        if (!productosPorCategoria[cat]) {
            productosPorCategoria[cat] = [];
        }
        productosPorCategoria[cat].push(prod);
    });

    var html = '';
    for (const [categoria, lista] of Object.entries(productosPorCategoria)) {
        lista.sort((a, b) => (Number(a.precio) || 0) - (Number(b.precio) || 0));
        const esCategoriaPizzas = ['pizza', 'pizzas'].includes(normalizarTexto(categoria));
        const productosPorTamanoPizza = esCategoriaPizzas ? lista.filter(producto => esNombreTamanoPizza(producto.nombre)) : [];
        const imagenCompartidaPizza = productosPorTamanoPizza
            .map(producto => String(producto.imagen_url || '').trim())
            .find(url => url.startsWith('http') && !url.includes('photo-1504674900247-0877df9cc836')) || '';
        const claseAnimacion = direccionAnimacionMenu === 'previous' ? 'menu-category-enter-previous' : 'menu-category-enter-next';
        html += `<div class="mb-8 ${claseAnimacion}"><h2 class="text-2xl md:text-3xl font-extrabold text-white border-b border-slate-800 pb-3 mb-5 tracking-tight"><span class="text-amber-400">✦</span> ${escaparHtml(categoria)}</h2>`;
        html += '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-5">';
        lista.forEach(producto => {
            const comparteImagenPizza = productosPorTamanoPizza.includes(producto);
            const visualProducto = obtenerVisualProducto(producto, comparteImagenPizza ? imagenCompartidaPizza : '');

            const personalizacion = obtenerPersonalizacionProducto(producto);
            const requierePersonalizacion = personalizacion.selectores.length > 0;
            const textoBoton = requierePersonalizacion ? textoBotonPersonalizacion(personalizacion.selectores) : '+ Agregar';
            const botonHtml = `
                <button type="button" data-action="personalizar" data-product-id="${escaparHtml(producto.id)}" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2 sm:py-3 px-2 sm:px-4 rounded-xl text-xs sm:text-sm transition shadow-lg shadow-red-950/30">
                    ${textoBoton}
                </button>
            `;

            html += `
                <div data-animacion-scroll class="menu-product-reveal group bg-[#111214] rounded-2xl overflow-hidden border border-slate-800 hover:border-red-900/80 shadow-lg shadow-black/20 transition duration-200 hover:-translate-y-0.5 flex flex-row sm:flex-col">
                    <div class="w-24 h-24 shrink-0 bg-[#090a0c] overflow-hidden sm:w-full sm:h-44">${visualProducto}</div>
                    <div class="min-w-0 p-3 sm:p-4 flex flex-col flex-1">
                        <div class="flex-1">
                            <h3 class="font-extrabold text-white text-sm sm:text-lg leading-snug">${escaparHtml(producto.nombre)}</h3>
                            <p class="text-xs sm:text-sm text-slate-400 mt-1 leading-relaxed lowercase">${producto.descripcion ? escaparHtml(producto.descripcion).toLowerCase() : ''}</p>
                        </div>
                        <div class="mt-2 sm:mt-5 flex flex-col gap-2 sm:gap-3">
                            <span class="font-extrabold text-amber-400 text-base sm:text-xl">$${Number(producto.precio).toLocaleString('es-CO')}</span>
                            ${botonHtml}
                        </div>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        html += '</div>';
    }

    contenedor.innerHTML = html;
    const tarjetas = contenedor.querySelectorAll('[data-animacion-scroll]');
    if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        tarjetas.forEach(tarjeta => tarjeta.classList.add('is-visible'));
        return;
    }
    observadorTarjetasMenu = new IntersectionObserver(entradas => {
        entradas.forEach(entrada => {
            if (!entrada.isIntersecting) return;
            entrada.target.classList.add('is-visible');
            observadorTarjetasMenu?.unobserve(entrada.target);
        });
    }, { threshold: 0.06, rootMargin: '0px 0px 32px 0px' });
    tarjetas.forEach(tarjeta => observadorTarjetasMenu.observe(tarjeta));
}
function filtrarCategoria(categoriaElegida) {
    const indiceAnterior = indiceCategoriaActiva;
    const nuevoIndice = categoriasMenu.indexOf(categoriaElegida);
    if (indiceAnterior >= 0 && nuevoIndice !== indiceAnterior) {
        direccionAnimacionMenu = nuevoIndice > indiceAnterior ? 'next' : 'previous';
    }
    indiceCategoriaActiva = nuevoIndice;
    document.querySelectorAll('#contenedor-categorias [data-categoria]').forEach(boton => {
        const activa = boton.dataset.categoria === categoriaElegida;
        boton.className = activa
            ? 'shrink-0 px-3.5 py-2 sm:px-5 sm:py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-red-600 text-white transition shadow whitespace-nowrap'
            : 'shrink-0 px-3.5 py-2 sm:px-5 sm:py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-[#141518] border border-slate-800 text-slate-200 hover:border-red-500 hover:text-white transition shadow whitespace-nowrap';
    });
    const barraCategorias = document.getElementById('contenedor-categorias');
    const botonActivo = Array.from(document.querySelectorAll('#contenedor-categorias [data-categoria]'))
        .find(boton => boton.dataset.categoria === categoriaElegida);
    if (barraCategorias && botonActivo) {
        const posicion = botonActivo.getBoundingClientRect().left
            - barraCategorias.getBoundingClientRect().left
            + barraCategorias.scrollLeft
            - (barraCategorias.clientWidth - botonActivo.clientWidth) / 2;
        const limite = barraCategorias.scrollWidth - barraCategorias.clientWidth;
        barraCategorias.scrollTo({ left: Math.max(0, Math.min(limite, posicion)), behavior: 'smooth' });
    }
    const filtrados = todosLosProductos.filter(p => resolverCategoriaCombo(p) === categoriaElegida);
    renderizarProductos(filtrados);
}

function cambiarCategoriaPorDeslizamiento(direccion) {
    if (!categoriasMenu.length || indiceCategoriaActiva < 0) return;
    const siguiente = Math.max(0, Math.min(categoriasMenu.length - 1, indiceCategoriaActiva + direccion));
    if (siguiente === indiceCategoriaActiva) return;
    filtrarCategoria(categoriasMenu[siguiente]);
}

// Solo interpreta gestos laterales iniciados sobre el catálogo. El scroll vertical
// y los botones de producto siguen funcionando con su comportamiento habitual.
const catalogoMenu = document.getElementById('contenedor-menu');
if (catalogoMenu) {
    catalogoMenu.addEventListener('touchstart', event => {
        if (event.touches.length !== 1) {
            inicioGestoMenu = null;
            return;
        }
        const objetivo = event.target instanceof Element ? event.target : null;
        if (objetivo?.closest('button, a, input, select, textarea, [role="dialog"]')) {
            inicioGestoMenu = null;
            return;
        }
        inicioGestoMenu = { x: event.touches[0].clientX, y: event.touches[0].clientY };
    }, { passive: true });

    catalogoMenu.addEventListener('touchend', event => {
        if (!inicioGestoMenu || !event.changedTouches.length) return;
        const dx = event.changedTouches[0].clientX - inicioGestoMenu.x;
        const dy = event.changedTouches[0].clientY - inicioGestoMenu.y;
        inicioGestoMenu = null;
        if (Math.abs(dx) < 65 || Math.abs(dx) <= Math.abs(dy) * 1.25) return;
        cambiarCategoriaPorDeslizamiento(dx < 0 ? 1 : -1);
    }, { passive: true });

    catalogoMenu.addEventListener('touchcancel', () => { inicioGestoMenu = null; }, { passive: true });
}

function normalizarTexto(valor) {
    return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function normalizarCategoriaMenu(categoria) {
    const etiqueta = String(categoria || 'General').trim();
    const clave = normalizarTexto(etiqueta).replace(/\s+/g, ' ');
    const categoriasCanonicas = {
        'hamburguesa': 'Hamburguesas',
        'hamburguesas': 'Hamburguesas',
        'pizza': 'Pizzas',
        'pizzas': 'Pizzas',
        'arepa': 'Arepas',
        'arepas': 'Arepas',
        'perro': 'Perros',
        'perros': 'Perros',
        'perro caliente': 'Perros',
        'perros calientes': 'Perros',
        'pollo broaster': 'Pollo a la Broaster',
        'pollo a la broaster': 'Pollo a la Broaster',
        'sandwich': 'Sándwiches',
        'sandwiches': 'Sándwiches'
    };
    return categoriasCanonicas[clave] || etiqueta;
}

function resolverCategoriaCombo(producto) {
    const categoriaOriginal = normalizarCategoriaMenu(producto._categoriaOriginal || producto.categoria);
    return esProductoCombo(producto) ? normalizarCategoriaMenu(resolverFamiliaCombo(producto)) : categoriaOriginal;
}

function esProductoCombo(producto) {
    const categoria = normalizarTexto(producto._categoriaOriginal || producto.categoria || '');
    const nombre = normalizarTexto(producto.nombre || '');
    const descripcion = normalizarTexto(producto.descripcion || '');
    const tieneMarcador = obtenerMetadataFamiliaCombo(producto) !== '';
    if (tieneMarcador || /\bcombos?\b/.test(categoria) || /\bcombo\b/.test(nombre) || /\bcombo\b/.test(descripcion)) return true;

    // Compatibilidad con combos que versiones anteriores guardaron dentro de
    // su categoría normal; las señales deben aparecer juntas para evitar mover
    // hamburguesas o platos individuales por error.
    const incluyeBebida = /\b(?:gaseosa|bebida|refresco)\b/.test(descripcion);
    const incluyeAcompanamiento = /\b(?:papas?|papa francesa|yuca|patacon|arepa|ensalada)\b/.test(descripcion);
    return incluyeBebida && incluyeAcompanamiento && /\b(?:hamburguesa|perro|pollo|broaster|lasana|pizza|combo)\b/.test(nombre);
}

function obtenerMetadataFamiliaCombo(producto) {
    const opciones = Array.isArray(producto.opciones) ? producto.opciones : (() => {
        try { return JSON.parse(producto.opciones || '[]'); } catch (error) { return []; }
    })();
    const marcador = opciones.find(opcion => opcion && opcion.grupo === '__velox_combo_family__');
    return String(marcador?.nombre || producto.familia_combo || '').trim();
}

function resolverFamiliaCombo(producto) {
    const familiaGuardada = obtenerMetadataFamiliaCombo(producto);
    const detectarFamiliaPrincipal = texto => {
        const textoNormalizado = normalizarTexto(texto);
        const arrozEspecifico = textoNormalizado.match(/\barroz\s+((?:(?:con|de)\s+)?[a-z]+(?:\s+(?!con\b|de\b|y\b)[a-z]+)?)/);
        if (arrozEspecifico) return `Arroz ${arrozEspecifico[1].trim()}`;

        const normalizado = textoNormalizado;
        const familias = [
            { patron: /\barroces?\b/, nombre: 'Arroces' },
            { patron: /\b(?:perros?|hot\s?dog)\b/, nombre: 'Perros' },
            { patron: /\b(?:hamburguesas?|burgers?)\b/, nombre: 'Hamburguesas' },
            { patron: /\bpizzas?\b/, nombre: 'Pizzas' },
            { patron: /\b(?:lasagna|lasana)\b/, nombre: 'Lasaña' },
            { patron: /\barepas?\b/, nombre: 'Arepas' },
            { patron: /\bsalchipapas?\b/, nombre: 'Salchipapas' },
            { patron: /\b(?:sandwiches?|emparedados?)\b/, nombre: 'Sándwiches' },
            { patron: /\b(?:tacos?|burritos?)\b/, nombre: 'Mexicanos' },
            { patron: /\b(?:pollo|broaster|alitas?|nuggets?)\b/, nombre: 'Pollo a la Broaster' },
            { patron: /\b(?:pescado|marisco)\b/, nombre: 'Pescados y mariscos' }
        ];
        return familias
            .map((familia, prioridad) => {
                const coincidencia = familia.patron.exec(normalizado);
                return coincidencia ? { nombre: familia.nombre, indice: coincidencia.index, prioridad } : null;
            })
            .filter(Boolean)
            .sort((a, b) => a.indice - b.indice || a.prioridad - b.prioridad)[0]?.nombre || '';
    };

    // Si el título identifica el plato principal, tiene prioridad sobre la descripción.
    const familiaPorNombre = detectarFamiliaPrincipal(producto.nombre);
    if (familiaPorNombre) return familiaPorNombre;

    // En títulos genéricos (Combo 1/Promoción 4), agrupa por el primer plato de la descripción.
    const primerComponente = String(producto.descripcion || '').split(/[,;+]/, 1)[0];
    const familiaPorInicioDescripcion = detectarFamiliaPrincipal(primerComponente);
    if (familiaPorInicioDescripcion) return familiaPorInicioDescripcion;

    if (familiaGuardada && normalizarTexto(familiaGuardada) !== 'otros') return familiaGuardada;
    return detectarFamiliaPrincipal(producto.descripcion) || 'Otros';
}

function obtenerOpcionesProducto(producto) {
    const normalizarOpcion = opcion => {
        if (typeof opcion === 'string' || typeof opcion === 'number') {
            return { grupo: 'Variante', nombre: String(opcion).trim(), descripcion: '' };
        }
        if (opcion && typeof opcion === 'object') {
            return {
                grupo: String(opcion.grupo || opcion.tipo || opcion.categoria || 'Variante').trim(),
                nombre: String(opcion.nombre || opcion.nombre_opcion || opcion.valor || opcion.label || '').trim(),
                descripcion: String(opcion.descripcion || opcion.detalle || '').trim()
            };
        }
        return null;
    };
    if (Array.isArray(producto.opciones)) return producto.opciones
        .filter(opcion => !(opcion && typeof opcion === 'object' && opcion.grupo === '__velox_combo_family__'))
        .map(normalizarOpcion).filter(opcion => opcion && opcion.nombre);
    if (typeof producto.opciones === 'string') {
        try {
            const parsed = JSON.parse(producto.opciones);
            if (Array.isArray(parsed)) return obtenerOpcionesProducto({ opciones: parsed });
        } catch (error) {
            return producto.opciones.split(',').map(normalizarOpcion).filter(opcion => opcion && opcion.nombre);
        }
    }
    return [];
}

function esOpcionDeTamano(opcion) {
    const texto = normalizarTexto(opcion).trim();
    return /^(?:tamano\s*[:=-]?\s*)?(?:mini|pequena|pequeno|chica|chico|mediana|mediano|grande|familiar|personal|individual|junior|kids|infantil|regular|mediano|gigante|jumbo|extra grande|xl|xxl|(?:\d+(?:[.,]\d+)?\s*)(?:ml|l|lt|litro(?:s)?|gr|g|kg|cm| pulgadas?))$/i.test(texto)
        || /^(?:tamano\s*[:=-]?\s*)?(?:pequena|chica|mediana|grande|familiar|personal|individual|jumbo|extra grande|xl|xxl)\s*\(.*\)$/i.test(texto);
}

function quitarTamanoDeOpcion(opcion) {
    return String(opcion || '').trim()
        .replace(/\s*[-(]?\s*\d+(?:[.,]\d+)?\s*(?:ml|l|lt|litros?|gr|g|kg|cm|pulgadas?)\)?\s*$/i, '')
        .replace(/\s*[-–(]?\s*(?:tamaño\s*[:=-]?\s*)?(?:mini|pequeñ[ao]s?|chic[ao]s?|median[ao]s?|grandes?|familiar(?:es)?|personal(?:es)?|individual(?:es)?|junior|kids|infantil(?:es)?|regular|gigante|jumbo|extra grande|xl|xxl)\)?\s*$/i, '')
        .replace(/^\s*(?:tamaño\s*[:=-]?\s*)?(?:mini|pequeñ[ao]s?|chic[ao]s?|median[ao]s?|grandes?|familiar(?:es)?|personal(?:es)?|individual(?:es)?|junior|kids|infantil(?:es)?|regular|gigante|jumbo|extra grande|xl|xxl)\s*[-–:]\s*/i, '')
        .replace(/^\s*(?:tamaño\s*[:=-]?\s*)?(?:mini|pequeñ[ao]s?|chic[ao]s?|median[ao]s?|grandes?|familiar(?:es)?|personal(?:es)?|individual(?:es)?|junior|kids|infantil(?:es)?|regular|gigante|jumbo|extra grande|xl|xxl)\s+/i, '')
        .replace(/[\s,;:–-]+$/, '').trim();
}

function esEtiquetaOpcion(texto) {
    return /^(?:opciones?|variantes?|sabores?|ingredientes?|acompanamientos?|tamanos?|categorias?|elige|selecciona|a eleccion)$/i.test(normalizarTexto(texto).trim());
}

function opcionesValidasProducto(producto) {
    const categorias = new Set(todosLosProductos.map(p => normalizarTexto(p.categoria || '')).filter(Boolean));
    const unicas = new Map();
    obtenerOpcionesProducto(producto).forEach(opcion => {
        const nombre = quitarTamanoDeOpcion(opcion.nombre);
        const normalizada = normalizarTexto(nombre);
        if (!normalizada || esOpcionDeTamano(nombre) || esEtiquetaOpcion(nombre) || categorias.has(normalizada)) return;
        const grupo = opcion.grupo || 'Variante';
        const llave = `${normalizarTexto(grupo)}|${normalizada}`;
        if (!unicas.has(llave)) unicas.set(llave, { grupo, nombre, descripcion: opcion.descripcion || '' });
    });
    return [...unicas.values()];
}

function productoMencionaBebida(texto) {
    return /\b(?:gaseosa|gaseosas|refresco|refrescos|bebida|bebidas|soda|sodas|jugo|jugos|limonada|limonadas|agua|aguas|cerveza|cervezas)\b/.test(texto);
}

function obtenerBebidasDisponibles() {
    return [...new Set(todosLosProductos
        .filter(producto => /\b(?:bebidas?|gaseosas?|refrescos?|jugos?|limonadas?|aguas?|cervezas?)\b/.test(normalizarTexto(producto.categoria || '')))
        .map(producto => quitarTamanoDeOpcion(producto.nombre))
        .filter(nombre => nombre && !esOpcionDeTamano(nombre)))];
}

function obtenerPersonalizacionProducto(producto) {
    const opcionesProducto = opcionesValidasProducto(producto);
    const texto = normalizarTexto(`${producto.nombre || ''} ${producto.descripcion || ''}`);
    const bebidasDisponibles = obtenerBebidasDisponibles();
    const mencionaBebidaDelMenu = bebidasDisponibles.some(bebida => bebida.length >= 3 && texto.includes(normalizarTexto(bebida)));
    const esComboConBebida = /\b(?:combo|combos|incluye|con)\b/.test(texto)
        && (productoMencionaBebida(texto) || mencionaBebidaDelMenu);
    const grupos = new Map();
    opcionesProducto.forEach(opcion => {
        const grupo = opcion.grupo || 'Variante';
        if (!grupos.has(grupo)) grupos.set(grupo, []);
        grupos.get(grupo).push(opcion);
    });
    if (esComboConBebida && bebidasDisponibles.length) {
        grupos.set('Bebida', bebidasDisponibles.map(nombre => ({ grupo: 'Bebida', nombre, descripcion: '' })));
    }
    const selectores = [...grupos.entries()].map(([grupo, opciones]) => ({
        etiqueta: /^(sabor|sabores|especialidad|especialidades)$/i.test(normalizarTexto(grupo)) ? 'Elige un sabor' : `Elige ${grupo.toLowerCase()}`,
        grupo,
        opciones
    }));

    return { selectores };
}

function textoBotonPersonalizacion(selectores) {
    if (selectores.length && selectores.every(selector => /^(sabor|sabores|especialidad|especialidades)$/i.test(normalizarTexto(selector.grupo)))) {
        return 'Elegir sabores';
    }
    return selectores.length > 1 ? 'Elegir opciones' : 'Elegir variante';
}

function escaparHtml(valor) {
    return String(valor || '').replace(/[&<>"']/g, caracter => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[caracter]);
}

let productoPersonalizacionActual = null;

function iniciarPersonalizacion(id) {
    const producto = todosLosProductos.find(p => String(p.id) === String(id));
    if (!producto) return;

    const personalizacion = obtenerPersonalizacionProducto(producto);
    const requiereEleccion = personalizacion.selectores.length > 0;

    if (!requiereEleccion) {
        agregarAlCarrito(producto.id, producto.nombre, producto.precio);
        return;
    }

    productoPersonalizacionActual = { producto, selectores: personalizacion.selectores };
    document.getElementById('nombre-personalizar').textContent = producto.nombre;
    const campos = document.getElementById('campos-personalizar');
    const html = personalizacion.selectores.map((selector, index) => {
        const idCampo = `opcion-personalizar-${index}`;
        const opcionesHtml = selector.opciones.map((opcion, opcionIndex) => `
            <label class="velox-option flex cursor-pointer items-start gap-3 rounded-xl border border-slate-700/70 bg-[#17191d] px-3.5 py-3 transition hover:border-red-500/60 hover:bg-[#1d1a1c]">
                <input type="radio" name="${idCampo}" data-selector-index="${index}" value="${opcionIndex}" required class="mt-0.5 h-4 w-4 shrink-0 accent-red-500 focus:ring-2 focus:ring-red-400/50">

                </span>
            </label>
        `).join('');
        return `<section aria-labelledby="${idCampo}-label"><h4 id="${idCampo}-label" class="mb-2.5 flex items-center gap-2 text-sm font-bold text-slate-200"><span class="h-5 w-1 rounded-full bg-gradient-to-b from-red-500 to-amber-400"></span>${escaparHtml(selector.etiqueta)}</h4><div class="velox-option-list max-h-[42vh] space-y-2 overflow-y-auto rounded-2xl border border-white/5 bg-black/15 p-2">${opcionesHtml}</div></section>`;
    }).join('');
    campos.innerHTML = `<p class="mb-4 rounded-xl border border-amber-400/15 bg-amber-400/[.06] px-3.5 py-2.5 text-xs leading-relaxed text-slate-300">Selecciona una opción para cada grupo y luego agrégala al pedido.</p>${html}`;

    const modal = document.getElementById('modal-personalizar');

}

function cerrarModalPersonalizar() {
    const modal = document.getElementById('modal-personalizar');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    productoPersonalizacionActual = null;
}

function confirmarPersonalizacion(event) {
    event.preventDefault();
    if (!productoPersonalizacionActual) return;

    const { producto, selectores } = productoPersonalizacionActual;
    const selecciones = Array.from(document.querySelectorAll('#campos-personalizar input[type="radio"][required]:checked')).map(input => {
        const selector = selectores[Number(input.dataset.selectorIndex)];
        const opcion = selector?.opciones[Number(input.value)];
        if (!selector || !opcion) return '';
        return `${selector.grupo}: ${opcion.nombre}${opcion.descripcion ? ` — ${opcion.descripcion}` : ''}`;
    }).filter(Boolean);

    const nombreCompleto = `${producto.nombre}${selecciones.length ? ` (${selecciones.join(' · ')})` : ''}`;
    const item = cart.find(i => i.id === producto.id && i.nombre === nombreCompleto);
    if (item) item.cantidad++;
    else cart.push({ id: producto.id, nombre: nombreCompleto, precio: Number(producto.precio), cantidad: 1 });

    actualizarBarraCarrito();
    cerrarModalPersonalizar();
}

    });

    contenedorItems.innerHTML = html;
    if (totalModal) totalModal.innerText = '$' + totalGeneral.toLocaleString('es-CO');
}

function cambiarCantidadItem(index, delta) {
    cart[index].cantidad += delta;
    if (cart[index].cantidad <= 0) {
        cart.splice(index, 1);
    }
    actualizarBarraCarrito();
    renderizarCarritoModal();
    
    // Si el carrito se quedó vacío, cerrar el modal automáticamente
    if (cart.length === 0) {
        cerrarModalPedido();
    }
}

function eliminarItemCarrito(index) {
    cart.splice(index, 1);
    actualizarBarraCarrito();
    renderizarCarritoModal();
    
    if (cart.length === 0) {
        cerrarModalPedido();
    }
}

        function cerrarModalPedido() {
            var modal = document.getElementById('modal-pedido');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

    async function confirmarYEnviarPedido(event) {
    event.preventDefault();

    var direccion = document.getElementById('input-direccion').value;
    var metodoPago = document.getElementById('select-pago').value;
    var notas = document.getElementById('input-notas').value;

    if (cart.length === 0) return;

    var total = 0;
    var detalles = [];
    for (var i = 0; i < cart.length; i++) {
        total += (cart[i].precio * cart[i].cantidad);
        detalles.push(cart[i].cantidad + ' x ' + cart[i].nombre);
    }
    var detallePedido = detalles.join(', ');

    // Validamos que ya tengamos los datos del restaurante cargados en memoria
    if (!window.RESTAURANTE_ACTUAL || !window.RESTAURANTE_ACTUAL.id) {
        alert("⚠️ Error: No se encontró el restaurante en el sistema.");
        return;
    }

    var restauranteData = window.RESTAURANTE_ACTUAL;
    var telefonoNegocio = "";
    var nombreNegocio = restauranteData.nombre_restaurante || "Restaurante";

    var telefonoCrudo = restauranteData.telefono || "";
    
    if (telefonoCrudo) {
        let telLimpio = String(telefonoCrudo).replace(/\D/g, '');
        if (telLimpio.length === 10) {
            telefonoNegocio = "57" + telLimpio;
        } else {
            telefonoNegocio = telLimpio;
        }
    }

    if (!telefonoNegocio) {
        alert("⚠️ Error: El restaurante no tiene un número de WhatsApp configurado.");
        return;
    }

    try {
        // 2. Guarda el pedido en la base de datos usando el ID real
        var resPedido = await supabaseClient.from('pedidos').insert([{
            restaurante_id: restauranteData.id,
            cliente_nombre: 'Anónimo',
            cliente_telefono: 'Sin teléfono',
            direccion: direccion,
            detalle: detallePedido,
            items: detallePedido,
            total: total,
            estado: 'Pendiente',
            metodo_pago: metodoPago,
            notas: notas || ''
        }]);

        if (resPedido.error) {
            console.error("Error de Supabase:", resPedido.error);
            alert("Error al guardar: " + resPedido.error.message);
            return;
        }

        // 3. Arma el mensaje estructurado para WhatsApp
        var mensajeWhatsapp = `*NUEVO PEDIDO - ${nombreNegocio}*\n\n` +
            `• *Dirección:* ${direccion}\n` +
            `• *Pedido:* ${detallePedido}\n` +
            `• *Total:* $ ${total.toLocaleString('es-CO')}\n` +
            `• *Pago:* ${metodoPago}\n` +
            (notas ? `• *Notas:* ${notas}\n` : '') +
            `\n\n[/NUEVO_PEDIDO]`;

        var linkFinal = 'https://wa.me/' + telefonoNegocio + '?text=' + encodeURIComponent(mensajeWhatsapp);

        // 4. Limpia el carrito y abre el WhatsApp correcto
        cart = [];
        if (typeof actualizarBarraCarrito === 'function') actualizarBarraCarrito();
        if (typeof cerrarModalPedido === 'function') cerrarModalPedido();

        window.location.href = linkFinal;
        return;

    } catch (err) {
        console.error("Error inesperado:", err);
        alert("Error inesperado: " + err.message);
    }
}
        window.cargarMenu = cargarMenu;
        window.onload = function() {
            cargarMenu();
        };
    </script>
